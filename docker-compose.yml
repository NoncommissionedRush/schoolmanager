name: schoolmanager

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: schoolmanager
      POSTGRES_PASSWORD: schoolmanager
      POSTGRES_DB: schoolmanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schoolmanager -d schoolmanager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
