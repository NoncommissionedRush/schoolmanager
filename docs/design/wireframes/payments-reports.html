<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wireframe — Payments and reports (CARM-70)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              background: "#ffffff",
              foreground: "#0f172a",
              muted: { DEFAULT: "#f1f5f9", foreground: "#475569" },
              primary: { DEFAULT: "#2563eb", foreground: "#ffffff" },
              accent: { DEFAULT: "#eff6ff", foreground: "#1e40af" },
              destructive: { DEFAULT: "#dc2626", foreground: "#ffffff" },
              border: "#e2e8f0",
              input: "#64748b",
              ring: "#2563eb",
            },
            borderRadius: { lg: "0.5rem", md: "6px", sm: "4px" },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .tnum {
        font-variant-numeric: tabular-nums;
      }
      .skeleton {
        background: #e2e8f0;
        border-radius: 4px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-slate-200 font-sans text-sm text-foreground">
    <div
      class="sticky top-0 z-50 flex flex-wrap items-center gap-x-4 gap-y-2 bg-slate-900 px-4 py-2 text-xs text-slate-100"
    >
      <strong class="text-sm">Wireframe · Phase 6</strong>
      <div class="flex flex-wrap gap-1" id="wf-screens"></div>
      <div class="flex items-center gap-1">
        <span class="text-slate-400">State:</span>
        <div class="flex flex-wrap gap-1" id="wf-states"></div>
      </div>
    </div>
    <div id="stage" class="flex justify-center p-6"></div>

    <script>
      /* --------------------------------------------------------------- helpers */
      const btn = (label, v = "primary", extra = "") => {
        const c = {
          primary: "bg-primary text-white hover:bg-blue-700",
          outline: "border border-input bg-white hover:bg-muted",
          ghost: "hover:bg-muted",
          link: "text-primary hover:underline px-0",
          destructive: "bg-destructive text-white",
        }[v];
        return `<button class="h-9 px-3 rounded-md font-medium inline-flex items-center justify-center gap-2 ${c} ${extra}">${label}</button>`;
      };
      const badge = (t, tone = "muted", icon = "") => {
        const c = {
          muted: "bg-slate-100 text-slate-700 border-slate-300",
          success: "bg-green-50 text-green-700 border-green-300",
          warning: "bg-amber-50 text-amber-700 border-amber-300",
          danger: "bg-red-50 text-red-700 border-red-300",
          info: "bg-blue-50 text-blue-700 border-blue-300",
          cyan: "bg-cyan-50 text-cyan-900 border-cyan-600",
        }[tone];
        return `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-xs font-medium rounded-sm border whitespace-nowrap ${c}">${icon ? `<span aria-hidden="true">${icon}</span>` : ""}${t}</span>`;
      };
      const STATUS = {
        UNPAID: () => badge("Unpaid", "danger", "⊘"),
        PARTLY_PAID: () => badge("Partly paid", "warning", "◌"),
        PAID: () => badge("Paid", "success", "✓"),
        IN_CREDIT: () => badge("In credit", "info", "▣"),
        NOTHING_DUE: () => badge("Nothing due", "muted", "–"),
      };
      const alert = (t, tone = "info") => {
        const c = {
          info: "bg-blue-50 text-blue-800 border-blue-300",
          warning: "bg-amber-50 text-amber-800 border-amber-300",
          danger: "bg-red-50 text-red-800 border-red-300",
          success: "bg-green-50 text-green-800 border-green-300",
        }[tone];
        return `<div role="${tone === "danger" ? "alert" : "status"}" class="rounded-md border px-3 py-2 ${c}">${t}</div>`;
      };
      const card = (inner, extra = "") =>
        `<section class="rounded-lg border border-border bg-white p-6 ${extra}">${inner}</section>`;
      const empty = (icon, title, desc, action = "") =>
        `<div class="flex flex-col items-center text-center gap-2 py-10"><div class="text-4xl text-slate-400" aria-hidden="true">${icon}</div><h2 class="text-lg font-semibold">${title}</h2><p class="text-muted-foreground max-w-sm">${desc}</p>${action}</div>`;
      const skel = (n, h = "h-10") =>
        Array.from(
          { length: n },
          () => `<div class="skeleton ${h}"></div>`,
        ).join("");
      const sel = (label, value, w = "") =>
        `<label class="inline-flex flex-col gap-1 ${w}"><span class="text-xs font-medium text-muted-foreground">${label}</span><span class="h-9 px-3 rounded-md border border-input bg-white inline-flex items-center justify-between gap-6">${value}<span aria-hidden="true">▾</span></span></label>`;
      const field = (label, value, hint = "") =>
        `<div class="space-y-1"><label class="font-medium block">${label}</label><div class="h-9 px-3 rounded-md border border-input bg-white flex items-center">${value}</div>${hint}</div>`;
      const stat = (label, value, sub = "") =>
        `<a href="#" class="rounded-lg border border-border bg-white p-4 block hover:bg-accent"><dt class="text-muted-foreground">${label}</dt><dd class="text-2xl font-semibold tnum mt-1">${value}</dd>${sub ? `<dd class="text-xs text-muted-foreground mt-1">${sub}</dd>` : ""}</a>`;
      const overlay = (bg, dialog) =>
        `<div class="relative">${bg}<div class="absolute inset-0 bg-black/50 rounded-lg flex items-start justify-center pt-24">${dialog}</div></div>`;
      const dialog = (title, inner, footer, w = "w-[480px]") =>
        `<div role="dialog" aria-modal="true" class="${w} rounded-lg bg-white shadow-lg p-6 space-y-4"><div class="flex justify-between"><h2 class="text-lg font-semibold">${title}</h2><button aria-label="Close">✕</button></div>${inner}<div class="flex justify-end gap-2 pt-2">${footer}</div></div>`;

      /* App shells */
      const NAV = [
        ["OVERVIEW", ["▣ Dashboard"]],
        [
          "SCHEDULE",
          ["📅 Timetable", "🗓 Absences & replacements", "⚙ Substitutions"],
        ],
        ["PEOPLE", ["🎓 Students", "🧑‍🏫 Teachers"]],
        ["ACADEMICS", ["📖 Courses & groups", "★ Ratings"]],
        ["FINANCE", ["👛 Payments", "📊 Reports"]],
      ];
      const sidebar = (active) =>
        `<nav aria-label="Main" class="w-56 shrink-0 border-r border-border bg-white p-3 space-y-3 text-sm">${NAV.map(
          ([s, items]) =>
            `<div><div class="px-2 text-xs font-semibold text-slate-500">${s}</div>${items
              .map(
                (i) =>
                  `<a href="#" ${i.includes(active) ? 'aria-current="page"' : ""} class="block px-2 py-1.5 rounded-md ${i.includes(active) ? "bg-accent text-accent-foreground font-medium" : "hover:bg-muted"}">${i}</a>`,
              )
              .join("")}</div>`,
        ).join("")}</nav>`;
      const appHeader = () =>
        `<header class="h-14 flex items-center gap-3 border-b border-border bg-white px-4"><span class="h-8 w-8 rounded bg-primary text-white grid place-items-center text-xs font-semibold">LL</span><strong>Lingua Language School</strong><div class="ml-auto flex items-center gap-3"><span aria-hidden="true">🔔</span><span class="inline-flex items-center gap-2"><span class="h-8 w-8 rounded-full bg-slate-200 grid place-items-center text-xs">AV</span>Anna ▾</span></div></header>`;
      const desktop = (inner, active = "Payments") =>
        `<div class="w-[1240px] rounded-lg overflow-hidden border border-slate-300 bg-muted">${appHeader()}<div class="flex">${sidebar(active)}<main class="flex-1 p-6 space-y-6 min-w-0">${inner}</main></div></div>`;
      const phone = (inner) =>
        `<div class="w-[390px] min-h-[780px] rounded-[2rem] border-8 border-slate-800 bg-white overflow-hidden text-base flex flex-col">
          <header class="h-14 flex items-center gap-2 border-b border-border px-3"><button class="h-11 w-11 text-lg" aria-label="Menu">☰</button><strong class="text-sm">Lingua Language School</strong><div class="ml-auto" aria-hidden="true">🔔</div></header>
          <main class="flex-1 p-4 space-y-4">${inner}</main>
          <nav class="h-16 border-t border-border grid grid-cols-5 text-xs text-center">${["🏠 Home", "📅 Timetable", "📋 Homework", "🗓 Absences", "☰ More"].map((t) => `<a class="grid place-items-center ${t.includes("More") ? "text-primary font-medium" : ""}" href="#">${t}</a>`).join("")}</nav>
        </div>`;
      const pageHeader = (title, action = "", desc = "") =>
        `<div class="flex items-start justify-between gap-4"><div><h1 class="text-2xl font-semibold">${title}</h1>${desc ? `<p class="text-muted-foreground mt-1">${desc}</p>` : ""}</div>${action}</div>`;
      const tabs = (items, active) =>
        `<div role="tablist" class="inline-flex rounded-md bg-slate-200 p-1">${items.map((t) => `<button role="tab" aria-selected="${t === active}" class="px-3 h-8 rounded ${t === active ? "bg-white shadow-sm font-medium" : "text-slate-600"}">${t}</button>`).join("")}</div>`;
      const table = (cols, rows, opts = {}) =>
        `<div class="overflow-x-auto"><table class="w-full text-left">${opts.caption ? `<caption class="sr-only">${opts.caption}</caption>` : ""}<thead class="bg-muted text-slate-600"><tr>${cols.map((c) => `<th scope="col" class="px-3 py-2 font-medium ${c.r ? "text-right" : ""}">${c.t}</th>`).join("")}</tr></thead><tbody class="divide-y divide-border">${rows.map((r) => `<tr class="hover:bg-accent/50">${r.map((v, i) => `<td class="px-3 py-2 align-top ${cols[i] && cols[i].r ? "text-right tnum" : ""}">${v}</td>`).join("")}</tr>`).join("")}</tbody>${opts.foot ? `<tfoot class="font-semibold border-t-2 border-border"><tr>${opts.foot.map((v, i) => `<td class="px-3 py-2 ${cols[i] && cols[i].r ? "text-right tnum" : ""}">${v}</td>`).join("")}</tr></tfoot>` : ""}</table></div>`;
      const a = (t) =>
        `<a href="#" class="text-primary hover:underline">${t}</a>`;
      const forbidden = () =>
        `<div class="w-[900px] rounded-lg border border-slate-300 bg-white">${appHeader()}<div class="p-16">${empty("🔒", "You don't have access to this page", "Payments and reports are for school admins only.", btn("Go to my dashboard"))}</div></div>`;

      /* ---------------------------------------------------------- balances */
      const PAY_TABS = ["Balances", "Payments", "Prices"];
      const payHead = (tab) =>
        pageHeader("Payments", btn("Record payment…")) + tabs(PAY_TABS, tab);
      const BAL = [
        [
          "Jana Kovac",
          "B1 Evening",
          "€240.00",
          "€0.00",
          "Owes €240.00",
          "UNPAID",
          "—",
          true,
        ],
        [
          "Petr Hruby",
          "A2 Morning",
          "€180.00",
          "€100.00",
          "Owes €80.00",
          "PARTLY_PAID",
          "3 Oct",
          true,
        ],
        [
          "Eva Lukac",
          "B1 Evening, C1 Business",
          "€390.00",
          "€300.00",
          "Owes €90.00",
          "PARTLY_PAID",
          "8 Oct",
          true,
        ],
        [
          "Marek Bielik",
          "Marek Bielik 1-on-1",
          "€120.00",
          "€140.00",
          "In credit €20.00",
          "IN_CREDIT",
          "12 Oct",
          false,
        ],
        [
          "Lucia Tomas",
          "B2 Evening",
          "€240.00",
          "€240.00",
          "Settled",
          "PAID",
          "1 Sep",
          false,
        ],
        [
          "Tomas Mraz",
          "A1 Trial",
          "€0.00",
          "€0.00",
          "Settled",
          "NOTHING_DUE",
          "—",
          false,
        ],
      ];
      function balances(st) {
        const stats = `<dl class="grid grid-cols-4 gap-4">${stat("Outstanding", "€3,420.00")}${stat("Collected in October", "€5,180.00")}${stat("Students owing", "23 of 112")}${stat("In credit", "€140.00 (4)")}</dl>`;
        const filters = `<div class="flex flex-wrap items-end gap-3">${sel("Term", "Autumn 2026")}${sel("Status", st === 3 ? "Paid" : "Owing")}${sel("Group", "Any")}<label class="inline-flex flex-col gap-1"><span class="text-xs font-medium text-muted-foreground">Search</span><input class="h-9 px-3 rounded-md border border-input w-56" placeholder="Search students…" /></label><label class="inline-flex items-center gap-2 h-9"><input type="checkbox" /> Include archived students</label></div>`;
        let body;
        if (st === 1) body = card(skel(6));
        else if (st === 2)
          body = card(
            empty(
              "👛",
              "No prices for Autumn 2026 yet",
              "Set prices for your courses and groups, then balances show up here.",
              btn("Set prices"),
            ),
          );
        else if (st === 3)
          body = card(
            empty(
              "✓",
              "Nobody owes anything for Autumn 2026.",
              "",
              a("Show all students"),
            ),
          );
        else if (st === 4)
          body = alert(
            "<strong>Couldn't load balances.</strong> " +
              btn("Try again", "outline", "ml-2"),
            "danger",
          );
        else {
          const rows = (st === 5 ? BAL : BAL.filter((r) => r[7])).map((r) => [
            a(r[0]),
            `<span class="text-muted-foreground">${r[1]}</span>`,
            r[2],
            r[3],
            `<span class="${r[5] === "UNPAID" || r[5] === "PARTLY_PAID" ? "font-semibold" : ""}">${r[4]}</span>`,
            STATUS[r[5]](),
            `<span class="tnum">${r[6]}</span>`,
            `<div class="flex gap-1 justify-end">${r[7] ? btn("Record payment", "outline", "h-8") : ""}<button class="h-8 w-8 rounded-md hover:bg-muted" aria-label="More actions for ${r[0]}">⋯</button></div>`,
          ]);
          body = card(
            table(
              [
                { t: "Student ↑" },
                { t: "Groups" },
                { t: "Charged", r: 1 },
                { t: "Paid", r: 1 },
                { t: "Balance ↓", r: 1 },
                { t: "Status" },
                { t: "Last payment" },
                { t: "" },
              ],
              rows,
            ) +
              `<div class="flex justify-between items-center pt-4 text-muted-foreground"><span>Showing 1–${rows.length} of ${st === 5 ? 112 : 23}</span><div class="flex gap-2">${btn("‹ Previous", "outline")}${btn("Next ›", "outline")}</div></div>`,
            "p-4",
          );
        }
        return desktop(
          payHead("Balances") +
            (st === 1
              ? `<div class="grid grid-cols-4 gap-4">${skel(4, "h-20")}</div>`
              : stats) +
            filters +
            body,
        );
      }

      /* ------------------------------------------------------- record dialog */
      function recordDialog(st) {
        const amount = ["80.00", "30.00", "120.00", "80.00", "80.00"][st];
        const feedback = [
          "",
          alert("ⓘ Partial payment: €50.00 will still be owed.", "info"),
          alert(
            "⚠ That's €40.00 more than owed. Petr Hruby will be in credit.",
            "warning",
          ),
          "",
          "",
        ][st];
        const dup =
          st === 3
            ? alert(
                "⚠ A payment of €80.00 was recorded for Petr Hruby 2 min ago by Martin Kral.<label class='flex items-center gap-2 mt-2'><input type='checkbox' /> This is a different payment</label>",
                "warning",
              )
            : "";
        const err =
          st === 4
            ? alert(
                "Couldn't record the payment. Nothing was saved. " +
                  btn("Try again", "outline", "ml-2 h-8"),
                "danger",
              )
            : "";
        const inner = `${err}
          ${field("Student (required)", "Petr Hruby <span class='ml-auto text-muted-foreground'>▾</span>")}
          <p class="text-muted-foreground -mt-2">Owes <strong class="text-foreground">€80.00</strong> · Expected by end of term: €60.00 more</p>
          <div class="space-y-1"><label class="font-medium block" for="amt">Amount (required)</label><div class="h-9 rounded-md border border-input bg-white flex items-center"><span class="px-3 text-muted-foreground border-r border-border h-full grid place-items-center" aria-hidden="true">€</span><input id="amt" inputmode="decimal" class="px-3 h-full flex-1 tnum outline-none" value="${amount}" /></div></div>
          ${feedback}
          <div class="grid grid-cols-2 gap-3">${field("Date (required)", "16 Oct 2026 <span class='ml-auto'>▾</span>")}${field("Method (required)", "Cash <span class='ml-auto'>▾</span>")}</div>
          ${field("Reference", "<span class='text-muted-foreground'>Receipt no. or bank reference</span>", "<p class='text-xs text-muted-foreground'>Shown to the student.</p>")}
          <div class="space-y-1"><label class="font-medium block">Note (admins only)</label><textarea class="w-full h-16 rounded-md border border-input p-2"></textarea></div>
          ${dup}`;
        const primary =
          st === 3 ? btn("Record anyway") : btn(`Record €${amount}`);
        return overlay(
          balances(0),
          dialog("Record payment", inner, btn("Cancel", "outline") + primary),
        );
      }

      /* ------------------------------------------------- student statement */
      const STMT = [
        ["1 Sep", "Carried over from Spring 2026", "", "", "€0.00", "none"],
        [
          "30 Sep",
          "B1 Evening · September · 8 lessons",
          "€120.00",
          "",
          "€120.00",
          "charge",
        ],
        [
          "3 Oct",
          "Payment · Cash · Receipt 0142",
          "",
          "€100.00",
          "€20.00",
          "pay",
        ],
        ["5 Oct", "Payment · Bank transfer", "", "€50.00", "€20.00", "void"],
        ["10 Oct", "Correction: Course book", "€15.00", "", "€35.00", "corr"],
        [
          "15 Oct",
          "B1 Evening · October so far · 4 lessons",
          "€60.00",
          "",
          "€95.00",
          "charge",
        ],
        [
          "16 Oct",
          "Correction: Sibling goodwill discount",
          "",
          "€15.00",
          "€80.00",
          "corr",
        ],
      ];
      function statementTable(expanded) {
        const rows = [];
        STMT.forEach((r, i) => {
          const isVoid = r[5] === "void";
          const desc =
            r[5] === "charge"
              ? `<button aria-expanded="${expanded && i === 1}" class="text-left hover:underline"><span aria-hidden="true">${expanded && i === 1 ? "▾" : "▸"}</span> ${r[1]}</button>`
              : r[1] +
                (isVoid ? " " + badge("Voided") : "") +
                (r[5] === "corr" ? " " + badge("Correction") : "");
          rows.push([
            `<span class="tnum">${r[0]}</span>`,
            desc,
            r[2],
            isVoid
              ? `<s>${r[3]}</s><span class="sr-only"> voided</span>`
              : r[3],
            r[4],
            r[5] === "none"
              ? ""
              : `<button class="h-8 w-8 rounded-md hover:bg-muted" aria-label="More actions for this entry">⋯</button>`,
          ]);
          if (expanded && i === 1) {
            rows.push([
              "",
              `<ul class="text-muted-foreground space-y-1 pl-5">${[
                ["2 Sep, 17:00", "Billed"],
                ["4 Sep, 17:00", "Billed"],
                ["9 Sep, 17:00", "Not billed: cancelled by the school"],
                ["11 Sep, 17:00", "Billed"],
                ["16 Sep, 17:00", "Not billed: cancelled before the cutoff"],
                ["… 6 more", ""],
              ]
                .map(
                  ([d, s]) =>
                    `<li class="flex gap-4"><span class="tnum w-28">${d}</span>${s.startsWith("Billed") ? badge("Billed", "success") : s ? badge(s, "muted") : ""}</li>`,
                )
                .join("")}</ul>`,
              "",
              "",
              "",
              "",
            ]);
          }
        });
        return table(
          [
            { t: "Date" },
            { t: "Description" },
            { t: "Charge", r: 1 },
            { t: "Paid", r: 1 },
            { t: "Balance", r: 1 },
            { t: "" },
          ],
          rows,
          { caption: "Statement for Autumn 2026" },
        );
      }
      function studentPage(st) {
        const head = `<a href="#" class="text-primary">‹ Students</a>${pageHeader("Petr Hruby", "")}${tabs(["Profile", "Groups", "Payments"], "Payments")}`;
        if (st === 3)
          return desktop(
            head +
              `<div class="grid grid-cols-3 gap-6">${skel(1, "h-40 col-span-2")}${skel(1, "h-40")}</div>` +
              card(skel(6)),
            "Students",
          );
        const balanceCard = card(
          `<h2 class="text-lg font-semibold">Balance</h2>
          <div class="flex items-center gap-3 mt-2"><span class="text-2xl font-semibold tnum">Owes €80.00</span>${STATUS.PARTLY_PAID()}</div>
          <p class="text-muted-foreground mt-1">Expected by end of term: €60.00 more</p>
          <div class="flex gap-2 mt-4">${btn("Record payment…")}${btn("Add correction…", "outline")}</div>`,
          "col-span-2",
        );
        const priceCard = card(
          `<h2 class="text-lg font-semibold">Price</h2><p class="mt-2">B1 Evening: group price</p><p class="tnum text-muted-foreground">€15.00 per lesson</p><div class="mt-4">${btn("Set student price…", "outline")}</div>`,
        );
        let menu = "";
        if (st === 2)
          menu = `<div class="absolute right-10 top-[132px] w-48 rounded-md border border-border bg-white shadow-lg py-1 z-10" role="menu">${["Refund…", "Void payment…", "History"].map((t) => `<div role="menuitem" class="px-3 py-1.5 hover:bg-muted">${t}</div>`).join("")}</div>`;
        const stmt = card(
          `<div class="flex items-end justify-between mb-3"><h2 class="text-lg font-semibold">Statement</h2>${sel("Term", "Autumn 2026")}</div><div class="relative">${statementTable(st === 1)}${menu}</div><p class="pt-3 border-t border-border mt-2 font-medium">Owes €80.00 at 16 Oct 2026</p>`,
          "p-4",
        );
        return desktop(
          head +
            `<div class="grid grid-cols-3 gap-6">${balanceCard}${priceCard}</div>` +
            stmt,
          "Students",
        );
      }

      /* --------------------------------------------- refund / correction / void */
      function fixDialogs(st) {
        const bg = studentPage(0);
        if (st === 0)
          return overlay(
            bg,
            dialog(
              "Refund to Petr Hruby",
              `<p class="text-muted-foreground">Records money paid back to Petr Hruby. It doesn't move any money by itself.</p>
            ${field("Amount (required)", "€ <span class='ml-2 tnum'>100.00</span>", "<p class='text-xs text-muted-foreground'>You can refund at most €100.00.</p>")}
            <div class="grid grid-cols-2 gap-3">${field("Date (required)", "16 Oct 2026")}${field("Method (required)", "Bank transfer ▾")}</div>

          );
        if (st === 2)
          extra = alert(
            "ⓘ No prices are set for Autumn 2026, so nothing is charged. " +
              a("Set prices"),
            "info",
          );
        const body =
          st === 2
            ? ""
            : card(
                table(
                  [
                    { t: "Month" },
                    { t: "Charged", r: 1 },
                    { t: "Collected", r: 1 },
                    { t: "Refunded", r: 1 },
                    { t: "Corrections (net)", r: 1 },
                    { t: "Outstanding at month end", r: 1 },
                  ],
                  [
                    [
                      "September 2026",
                      "€9,120.00",
                      "€8,040.00",
                      "€0.00",
                      "−€30.00",
                      "€1,050.00",
                    ],
                    [
                      "October 2026 (to 16 Oct)",
                      "€9,120.00",
                      "€7,020.00",
                      "€100.00",
                      "€15.00",
                      "€3,420.00",
                    ],
                  ],
                  {
                    foot: [
                      "Total",
                      "€18,240.00",
                      "€15,060.00",
                      "€100.00",
                      "−€15.00",
                      "€3,420.00",
                    ],
                  },
                ),
                "p-4",
              ) +
              card(
                `<div class="flex justify-between"><h2 class="text-lg font-semibold">Who owes</h2>${a("See all in Balances ›")}</div>` +
                  table(
                    [{ t: "Student" }, { t: "Balance", r: 1 }],
                    [
                      [a("Jana Kovac"), "Owes €240.00"],
                      [a("Eva Lukac"), "Owes €90.00"],
                      [a("Petr Hruby"), "Owes €80.00"],
                    ],
                  ),
                "p-4",
              );
        return reportShell(
          "Revenue & outstanding",
          "What was charged, what was collected and what is still owed.",
          filters,
          st === 2 ? "" : stats,
          extra + body,
          "Voided entries aren't counted. Amounts in EUR.",
          exportBtn(true),
        );
      }

      /* --------------------------------------------------------- settings */
      function settings() {
        return desktop(
          pageHeader("Payments", "", "Settings") +
            card(`<div class="max-w-2xl space-y-4">
              ${field("Currency", "EUR — Euro <span class='ml-auto'>🔒</span>", "<p class='text-xs text-muted-foreground'>The currency can't change once prices or payments exist.</p>")}
              <div class="space-y-1"><label class="font-medium block">Payment instructions for students</label><textarea class="w-full h-24 rounded-md border border-input p-2">Pay at the office (Mon–Fri 9:00–18:00) or by bank transfer to SK12 1100 0000 0026 1234 5678. Reference: your full name.</textarea><p class="text-xs text-muted-foreground">Shown on the students' Payments page, e.g. your bank account and what to write as the reference.</p></div>
              ${btn("Save changes")}</div>`),
          "Settings",
        );
      }

      /* ----------------------------------------------------------- screens */
      const SCREENS = [
        {
          k: "bal",
          label: "Balances",
          states: [
            "owing",
            "loading",
            "no prices",
            "nobody owes",
            "error",
            "all students",
          ],
          fn: balances,
        },
        {
          k: "rec",
          label: "Record payment",
          states: [
            "full",
            "partial",
            "over → credit",
            "possible duplicate",
            "error",
          ],
          fn: recordDialog,
        },
        {
          k: "stmt",
          label: "Student › Payments",
          states: ["statement", "charge expanded", "row menu", "loading"],
          fn: studentPage,
        },
        {
          k: "fix",
          label: "Refund / correct / void",
          states: [
            "refund",
            "correction",
            "void",
            "void blocked",
            "history sheet",
          ],
          fn: fixDialogs,
        },
        {
          k: "jr",
          label: "Payments journal",
          states: ["list", "empty"],
          fn: journal,
        },
        {
          k: "pr",
          label: "Prices",
          states: ["list", "set price dialog", "no term"],
          fn: prices,
        },
        {
          k: "set",
          label: "Settings › Payments",
          states: ["form"],
          fn: settings,
        },
        {
          k: "stu",
          label: "Student payments (mobile)",
          states: [
            "owes",
            "all paid",
            "in credit",
            "loading",
            "empty",
            "error",
            "charge sheet",
            "home card + More",
          ],
          fn: (s) =>
            s === 6
              ? studentChargeSheet()
              : s === 7
                ? studentHome()
                : studentPayments(s),
        },
        { k: "ri", label: "Reports", states: ["index"], fn: reportsIndex },
        {
          k: "ra",
          label: "Attendance",
          states: ["by group", "by student", "loading", "no data"],
          fn: attendance,
        },
        {
          k: "rh",
          label: "Teacher hours",
          states: [
            "summary",
            "teacher detail",
            "range too long",
            "export menu",
          ],
          fn: hours,
        },
        {
          k: "rr",
          label: "Revenue",
          states: ["by month", "too many rows", "no prices"],
          fn: revenue,
        },
        {
          k: "403",
          label: "403 (teacher)",
          states: ["forbidden"],
          fn: forbidden,
        },
      ];
      let cur = { screen: "bal", state: 0 };
      function render() {
        const s = SCREENS.find((x) => x.k === cur.screen);
        document.getElementById("wf-screens").innerHTML = SCREENS.map(
          (x) =>
            `<button data-go="${x.k}" class="px-2 py-1 rounded ${x.k === cur.screen ? "bg-white text-slate-900 font-medium" : "bg-slate-700 hover:bg-slate-600"}">${x.label}</button>`,
        ).join("");
        document.getElementById("wf-states").innerHTML = s.states
          .map(
            (st, i) =>
              `<button data-state="${i}" class="px-2 py-1 rounded ${i === cur.state ? "bg-blue-500 text-white" : "bg-slate-700 hover:bg-slate-600"}">${st}</button>`,
          )
          .join("");
        document.getElementById("stage").innerHTML = s.fn(cur.state);
      }
      document.addEventListener("click", (e) => {
        const go = e.target.closest("[data-go]"),
          st = e.target.closest("[data-state]");
        if (go) {
          e.preventDefault();
          cur = { screen: go.dataset.go, state: 0 };
        } else if (st) cur.state = +st.dataset.state;
        else return;
        render();
      });
      render();
    </script>
  </body>
</html>
