<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wireframe — Payments and reports (CARM-70)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              background: "#ffffff",
              foreground: "#0f172a",
              muted: { DEFAULT: "#f1f5f9", foreground: "#475569" },
              primary: { DEFAULT: "#2563eb", foreground: "#ffffff" },
              accent: { DEFAULT: "#eff6ff", foreground: "#1e40af" },
              destructive: { DEFAULT: "#dc2626", foreground: "#ffffff" },
              border: "#e2e8f0",
              input: "#64748b",
              ring: "#2563eb",
            },
            borderRadius: { lg: "0.5rem", md: "6px", sm: "4px" },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .tnum {
        font-variant-numeric: tabular-nums;
      }
      .skeleton {
        background: #e2e8f0;
        border-radius: 4px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-slate-200 font-sans text-sm text-foreground">
    <div
      class="sticky top-0 z-50 flex flex-wrap items-center gap-x-4 gap-y-2 bg-slate-900 px-4 py-2 text-xs text-slate-100"
    >
      <strong class="text-sm">Wireframe · Phase 6</strong>
      <div class="flex flex-wrap gap-1" id="wf-screens"></div>
      <div class="flex items-center gap-1">
        <span class="text-slate-400">State:</span>
        <div class="flex flex-wrap gap-1" id="wf-states"></div>
      </div>
    </div>
    <div id="stage" class="flex justify-center p-6"></div>

    <script>
      /* --------------------------------------------------------------- helpers */
      const btn = (label, v = "primary", extra = "") => {
        const c = {
          primary: "bg-primary text-white hover:bg-blue-700",
          outline: "border border-input bg-white hover:bg-muted",
          ghost: "hover:bg-muted",
          link: "text-primary hover:underline px-0",
          destructive: "bg-destructive text-white",
        }[v];
        return `<button class="h-9 px-3 rounded-md font-medium inline-flex items-center justify-center gap-2 ${c} ${extra}">${label}</button>`;
      };
      const badge = (t, tone = "muted", icon = "") => {
        const c = {
          muted: "bg-slate-100 text-slate-700 border-slate-300",
          success: "bg-green-50 text-green-700 border-green-300",
          warning: "bg-amber-50 text-amber-700 border-amber-300",
          danger: "bg-red-50 text-red-700 border-red-300",
          info: "bg-blue-50 text-blue-700 border-blue-300",
          cyan: "bg-cyan-50 text-cyan-900 border-cyan-600",
        }[tone];
        return `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-xs font-medium rounded-sm border whitespace-nowrap ${c}">${icon ? `<span aria-hidden="true">${icon}</span>` : ""}${t}</span>`;
      };
      const STATUS = {
        NOTHING_DUE: () => badge("Nothing due", "muted", "–"),
        SETTLED: () => badge("Settled", "success", "✓"),
        IN_CREDIT: () => badge("In credit", "info", "▣"),
        DUE: () => badge("Due", "warning", "◷"),
        OVERDUE: () => badge("Overdue", "danger", "!"),
      };
      const alert = (t, tone = "info") => {
        const c = {
          info: "bg-blue-50 text-blue-800 border-blue-300",
          warning: "bg-amber-50 text-amber-800 border-amber-300",
          danger: "bg-red-50 text-red-800 border-red-300",
          success: "bg-green-50 text-green-800 border-green-300",
        }[tone];
        return `<div role="${tone === "danger" ? "alert" : "status"}" class="rounded-md border px-3 py-2 ${c}">${t}</div>`;
      };
      const card = (inner, extra = "") =>
        `<section class="rounded-lg border border-border bg-white p-6 ${extra}">${inner}</section>`;
      const empty = (icon, title, desc, action = "") =>
        `<div class="flex flex-col items-center text-center gap-2 py-10"><div class="text-4xl text-slate-400" aria-hidden="true">${icon}</div><h2 class="text-lg font-semibold">${title}</h2><p class="text-muted-foreground max-w-sm">${desc}</p>${action}</div>`;
      const skel = (n, h = "h-10") =>
        Array.from(
          { length: n },
          () => `<div class="skeleton ${h}"></div>`,
        ).join("");
      const sel = (label, value, w = "") =>
        `<label class="inline-flex flex-col gap-1 ${w}"><span class="text-xs font-medium text-muted-foreground">${label}</span><span class="h-9 px-3 rounded-md border border-input bg-white inline-flex items-center justify-between gap-6">${value}<span aria-hidden="true">▾</span></span></label>`;
      const field = (label, value, hint = "") =>
        `<div class="space-y-1"><label class="font-medium block">${label}</label><div class="h-9 px-3 rounded-md border border-input bg-white flex items-center">${value}</div>${hint}</div>`;
      const stat = (label, value, sub = "") =>
        `<a href="#" class="rounded-lg border border-border bg-white p-4 block hover:bg-accent"><dt class="text-muted-foreground">${label}</dt><dd class="text-2xl font-semibold tnum mt-1">${value}</dd>${sub ? `<dd class="text-xs text-muted-foreground mt-1">${sub}</dd>` : ""}</a>`;
      const overlay = (bg, dialog) =>
        `<div class="relative">${bg}<div class="absolute inset-0 bg-black/50 rounded-lg flex items-start justify-center pt-24">${dialog}</div></div>`;
      const dialog = (title, inner, footer, w = "w-[480px]") =>
        `<div role="dialog" aria-modal="true" class="${w} rounded-lg bg-white shadow-lg p-6 space-y-4"><div class="flex justify-between"><h2 class="text-lg font-semibold">${title}</h2><button aria-label="Close">✕</button></div>${inner}<div class="flex justify-end gap-2 pt-2">${footer}</div></div>`;

      /* App shells */
      const NAV = [
        ["OVERVIEW", ["▣ Dashboard"]],
        [
          "SCHEDULE",
          ["📅 Timetable", "🗓 Absences & replacements", "⚙ Substitutions"],
        ],
        ["PEOPLE", ["🎓 Students", "🧑‍🏫 Teachers"]],
        ["ACADEMICS", ["📖 Courses & groups", "★ Ratings"]],
        ["FINANCE", ["👛 Payments", "📊 Reports"]],
      ];
      const sidebar = (active) =>
        `<nav aria-label="Main" class="w-56 shrink-0 border-r border-border bg-white p-3 space-y-3 text-sm">${NAV.map(
          ([s, items]) =>
            `<div><div class="px-2 text-xs font-semibold text-slate-500">${s}</div>${items
              .map(
                (i) =>
                  `<a href="#" ${i.includes(active) ? 'aria-current="page"' : ""} class="block px-2 py-1.5 rounded-md ${i.includes(active) ? "bg-accent text-accent-foreground font-medium" : "hover:bg-muted"}">${i}</a>`,
              )
              .join("")}</div>`,
        ).join("")}</nav>`;
      const appHeader = () =>
        `<header class="h-14 flex items-center gap-3 border-b border-border bg-white px-4"><span class="h-8 w-8 rounded bg-primary text-white grid place-items-center text-xs font-semibold">LL</span><strong>Lingua Language School</strong><div class="ml-auto flex items-center gap-3"><span aria-hidden="true">🔔</span><span class="inline-flex items-center gap-2"><span class="h-8 w-8 rounded-full bg-slate-200 grid place-items-center text-xs">AV</span>Anna ▾</span></div></header>`;
      const desktop = (inner, active = "Payments") =>
        `<div class="w-[1240px] rounded-lg overflow-hidden border border-slate-300 bg-muted">${appHeader()}<div class="flex">${sidebar(active)}<main class="flex-1 p-6 space-y-6 min-w-0">${inner}</main></div></div>`;
      const phone = (inner) =>
        `<div class="w-[390px] min-h-[780px] rounded-[2rem] border-8 border-slate-800 bg-white overflow-hidden text-base flex flex-col">
          <header class="h-14 flex items-center gap-2 border-b border-border px-3"><button class="h-11 w-11 text-lg" aria-label="Menu">☰</button><strong class="text-sm">Lingua Language School</strong><div class="ml-auto" aria-hidden="true">🔔</div></header>
          <main class="flex-1 p-4 space-y-4">${inner}</main>
          <nav class="h-16 border-t border-border grid grid-cols-5 text-xs text-center">${["🏠 Home", "📅 Timetable", "📋 Homework", "🗓 Absences", "☰ More"].map((t) => `<a class="grid place-items-center ${t.includes("More") ? "text-primary font-medium" : ""}" href="#">${t}</a>`).join("")}</nav>
        </div>`;
      const pageHeader = (title, action = "", desc = "") =>
        `<div class="flex items-start justify-between gap-4"><div><h1 class="text-2xl font-semibold">${title}</h1>${desc ? `<p class="text-muted-foreground mt-1">${desc}</p>` : ""}</div>${action}</div>`;
      const tabs = (items, active) =>
        `<div role="tablist" class="inline-flex rounded-md bg-slate-200 p-1">${items.map((t) => `<button role="tab" aria-selected="${t === active}" class="px-3 h-8 rounded ${t === active ? "bg-white shadow-sm font-medium" : "text-slate-600"}">${t}</button>`).join("")}</div>`;
      const table = (cols, rows, opts = {}) =>
        `<div class="overflow-x-auto"><table class="w-full text-left">${opts.caption ? `<caption class="sr-only">${opts.caption}</caption>` : ""}<thead class="bg-muted text-slate-600"><tr>${cols.map((c) => `<th scope="col" class="px-3 py-2 font-medium ${c.r ? "text-right" : ""}">${c.t}</th>`).join("")}</tr></thead><tbody class="divide-y divide-border">${rows.map((r) => `<tr class="hover:bg-accent/50">${r.map((v, i) => `<td class="px-3 py-2 align-top ${cols[i] && cols[i].r ? "text-right tnum" : ""}">${v}</td>`).join("")}</tr>`).join("")}</tbody>${opts.foot ? `<tfoot class="font-semibold border-t-2 border-border"><tr>${opts.foot.map((v, i) => `<td class="px-3 py-2 ${cols[i] && cols[i].r ? "text-right tnum" : ""}">${v}</td>`).join("")}</tr></tfoot>` : ""}</table></div>`;
      const a = (t) =>
        `<a href="#" class="text-primary hover:underline">${t}</a>`;
      const forbidden = () =>
        `<div class="w-[900px] rounded-lg border border-slate-300 bg-white">${appHeader()}<div class="p-16">${empty("🔒", "You don't have access to this page", "Payments and reports are for school admins only.", btn("Go to my dashboard"))}</div></div>`;

      /* ---------------------------------------------------------- balances */
      const PAY_TABS = ["Balances", "Payments", "Prices"];
      const payHead = (tab) =>
        pageHeader("Payments", btn("Record payment…")) + tabs(PAY_TABS, tab);
      const BAL = [
        [
          "Jana Kovac",
          "B1 Evening",
          "Owes €240.00",
          "€120.00",
          "14 Sep",
          "OVERDUE",
          "—",
          true,
        ],
        [
          "Eva Lukac",
          "B1 Evening, C1 Business",
          "Owes €90.00",
          "€30.00",
          "29 Sep",
          "OVERDUE",
          "8 Oct",
          true,
        ],
        [
          "Petr Hruby",
          "A2 Morning",
          "Owes €80.00",
          "—",
          "—",
          "DUE",
          "3 Oct",
          true,
        ],
        [
          "Marek Bielik",
          "Marek Bielik 1-on-1",
          "In credit €20.00",
          "—",
          "—",
          "IN_CREDIT",
          "12 Oct",
          false,
        ],
        [
          "Lucia Tomas",
          "B2 Evening",
          "Settled",
          "—",
          "—",
          "SETTLED",
          "1 Sep",
          false,
        ],
        [
          "Tomas Mraz",
          "A1 Scholarship",
          "Settled",
          "—",
          "—",
          "NOTHING_DUE",
          "—",
          false,
        ],
      ];
      function balances(st) {
        const stats = `<dl class="grid grid-cols-4 gap-4">${stat("Owed", "€3,420.00")}${stat("Overdue", "€1,260.00")}${stat("Students owing", "23 (9 overdue)")}${stat("In credit", "€140.00 (4)")}</dl>`;
        const filters = `<div class="flex flex-wrap items-end gap-3">${sel("Status", st === 5 ? "Any" : "Owing")}${sel("Group", "Any")}<label class="inline-flex flex-col gap-1"><span class="text-xs font-medium text-muted-foreground">Search</span><input class="h-9 px-3 rounded-md border border-input w-56" placeholder="Search students…" /></label><label class="inline-flex items-center gap-2 h-9"><input type="checkbox" /> Include archived students</label></div>`;
        const notice = alert(
          `ⓘ 2 groups have lessons without a price. ${a("Open Prices")}`,
          "info",
        );
        let body;
        if (st === 1) body = card(skel(6));
        else if (st === 2)
          body = card(
            empty(
              "👛",
              "No prices yet",
              "Set prices for your courses and groups. Then balances show up here.",
              btn("Set prices"),
            ),
          );
        else if (st === 3)
          body = card(
            empty(
              "✓",
              "Nobody owes anything right now.",
              "",
              a("Show all students"),
            ),
          );
        else if (st === 4)
          body = alert(
            "<strong>Couldn't load balances.</strong> " +
              btn("Try again", "outline", "ml-2"),
            "danger",
          );
        else {
          const rows = (st === 5 ? BAL : BAL.filter((r) => r[7])).map((r) => [
            a(r[0]),
            `<span class="text-muted-foreground">${r[1]}</span>`,
            `<span class="${r[7] ? "font-semibold" : ""}">${r[2]}</span>`,
            r[3],
            `<span class="tnum">${r[4]}</span>`,
            STATUS[r[5]](),
            `<span class="tnum">${r[6]}</span>`,
            `<div class="flex gap-1 justify-end">${r[7] ? btn("Record payment", "outline", "h-8") : ""}<button class="h-8 w-8 rounded-md hover:bg-muted" aria-label="More actions for ${r[0]}">⋯</button></div>`,
          ]);
          body = card(
            table(
              [
                { t: "Student" },
                { t: "Groups" },
                { t: "Balance", r: 1 },
                { t: "Overdue ↓", r: 1 },
                { t: "Oldest due" },
                { t: "Status" },
                { t: "Last payment" },
                { t: "" },
              ],
              rows,
            ) +
              `<div class="flex justify-between items-center pt-4 text-muted-foreground"><span>Showing 1–${rows.length} of ${st === 5 ? 112 : 23}</span><div class="flex gap-2">${btn("‹ Previous", "outline")}${btn("Next ›", "outline")}</div></div>`,
            "p-4",
          );
        }
        return desktop(
          payHead("Balances") +
            (st === 1
              ? `<div class="grid grid-cols-4 gap-4">${skel(4, "h-20")}</div>`
              : stats) +
            filters +
            (st === 0 ? notice : "") +
            body,
        );
      }

      /* ------------------------------------------------------- record dialog */
      function recordDialog(st) {
        const amount = ["80.00", "30.00", "120.00", "80.00"][st];
        const feedback = [
          "",
          alert(
            "ⓘ Partial payment: pays the oldest lines first. €50.00 will still be owed.",
            "info",
          ),
          alert(
            "ⓘ That's €40.00 more than owed. Petr Hruby will be in credit.",
            "info",
          ),
          "",
        ][st];
        const err =
          st === 3
            ? alert(
                "Couldn't record the payment. Nothing was saved. " +
                  btn("Try again", "outline", "ml-2 h-8"),
                "danger",
              )
            : "";
        const inner = `${err}
          ${field("Student (required)", "Petr Hruby <span class='ml-auto text-muted-foreground'>▾</span>")}
          <p class="text-muted-foreground -mt-2">Owes <strong class="text-foreground">€80.00</strong> · ${STATUS.DUE()}</p>
          <div class="space-y-1"><label class="font-medium block" for="amt">Amount (required)</label><div class="h-9 rounded-md border border-input bg-white flex items-center"><span class="px-3 text-muted-foreground border-r border-border h-full grid place-items-center" aria-hidden="true">€</span><input id="amt" inputmode="decimal" class="px-3 h-full flex-1 tnum outline-none" value="${amount}" /></div></div>
          ${feedback}
          <div class="grid grid-cols-2 gap-3">${field("Received on (required)", "16 Oct 2026 <span class='ml-auto'>▾</span>")}${field("Method (required)", "Cash <span class='ml-auto'>▾</span>")}</div>
          ${field("Reference", "<span class='text-muted-foreground'>Receipt no. or bank reference</span>", "<p class='text-xs text-muted-foreground'>Shown to the student.</p>")}
          <div class="space-y-1"><label class="font-medium block">Note (admins only)</label><textarea class="w-full h-16 rounded-md border border-input p-2"></textarea></div>`;
        return overlay(
          balances(0),
          dialog(
            "Record payment",
            inner,
            btn("Cancel", "outline") + btn(`Record €${amount}`),
          ),
        );
      }

      /* ------------------------------------------------- student statement */
      const LINE = {
        PAID: () => badge("Paid", "success", "✓"),
        PART: (p, t) => badge(`Partly paid · ${p} of ${t}`, "warning", "◌"),
        UNPAID: () => badge("Unpaid", "muted"),
        OVERDUE: () => badge("Overdue", "danger", "!"),
      };
      function statementTable(opts = {}) {
        const menu = (l) =>
          `<button class="h-8 w-8 rounded-md hover:bg-muted" aria-label="More actions for ${l}">⋯</button>`;
        const month = (label, open) => [
          `<button aria-expanded="${open}" class="font-medium text-left">${open ? "▾" : "▸"} ${label}</button>`,
          "",
          "",
          "",
          "",
          "",
          "",
          "",
        ];
        const rows = [];
        rows.push(
          month("September 2026 · 8 lessons · €120.00", !!opts.expanded),
        );
        if (opts.expanded)
          [
            ["2 Sep", "Tue 2 Sep 17:00", "16 Sep", "€15.00", "€15.00"],
            ["4 Sep", "Thu 4 Sep 17:00", "18 Sep", "€15.00", "€30.00"],
            ["11 Sep", "Thu 11 Sep 17:00", "25 Sep", "€15.00", "€45.00"],
          ].forEach((r) =>
            rows.push([
              `<span class="tnum">${r[0]}</span>`,
              `<span class="pl-4">B1 Evening · lesson ${r[1]}</span>`,
              `<span class="tnum">${r[2]}</span>`,
              LINE.PAID(),
              r[3],
              "",
              r[4],
              menu("lesson"),
            ]),
          );
        rows.push([
          `<span class="tnum">3 Oct</span>`,
          "Payment · Cash · Receipt 0142",
          "",
          "",
          "",
          "€100.00",
          "€20.00",
          menu("payment"),
        ]);
        if (opts.voided)
          rows.push([
            `<span class="tnum">5 Oct</span>`,
            `Payment · Bank transfer ${badge("Voided")}`,
            "",
            `<span class="text-muted-foreground">Recorded twice</span>`,
            "",
            `<s>€50.00</s><span class="sr-only"> voided</span>`,
            "€20.00",
            menu("payment"),
          ]);
        rows.push([
          `<span class="tnum">10 Oct</span>`,
          `Adjustment: fee <span class="text-muted-foreground">(Course book)</span>`,
          `<span class="tnum">24 Oct</span>`,
          LINE.PART("€5.00", "€15.00"),
          "€15.00",
          "",
          "€35.00",
          menu("adjustment"),
        ]);
        rows.push([
          `<span class="tnum">13 Oct</span>`,
          "B1 Evening · lesson Mon 13 Oct 17:00",
          `<span class="tnum">27 Oct</span>`,
          LINE.UNPAID(),
          "€15.00",
          "",
          "€50.00",
          menu("lesson"),
        ]);
        rows.push([
          `<span class="tnum">15 Oct</span>`,
          "B1 Evening · lesson Wed 15 Oct 17:00",
          `<span class="tnum">29 Oct</span>`,
          LINE.UNPAID(),
          "€15.00",
          "",
          "€65.00",
          menu("lesson"),
        ]);
        rows.push([
          `<span class="tnum">16 Oct</span>`,
          `Waived: ${a("B1 Evening · lesson 15 Oct")} <span class="text-muted-foreground">(Teacher left early)</span>`,
          "",
          "",
          `− €15.00<span class="sr-only"> discount</span>`,
          "",
          "€50.00",
          menu("waiver"),
        ]);
        rows.push([
          `<span class="tnum">16 Oct</span>`,
          `Conversation Club · Autumn 2026 fee (10 of 16 lessons)`,
          `<span class="tnum">30 Oct</span>`,
          LINE.UNPAID(),
          "€30.00",
          "",
          "€80.00",
          menu("term line"),
        ]);
        return table(
          [
            { t: "Date" },
            { t: "Line" },
            { t: "Due" },
            { t: "State" },
            { t: "Charge", r: 1 },
            { t: "Paid", r: 1 },
            { t: "Balance", r: 1 },
            { t: "" },
          ],
          rows,
          { caption: "Statement for Petr Hruby" },
        );
      }
      function studentPage(st) {
        const head = `<a href="#" class="text-primary">‹ Students</a>${pageHeader("Petr Hruby", "")}${tabs(["Profile", "Groups", "Payments"], "Payments")}`;
        if (st === 4)
          return desktop(
            head +
              `<div class="grid grid-cols-3 gap-6">${skel(1, "h-40 col-span-2")}${skel(1, "h-40")}</div>` +
              card(skel(6)),
            "Students",
          );
        const balanceCard = card(
          `<h2 class="text-lg font-semibold">Balance</h2>
          <div class="flex items-center gap-3 mt-2"><span class="text-2xl font-semibold tnum">Owes €80.00</span>${STATUS.DUE()}</div>
          <p class="text-muted-foreground mt-1">Next due: €10.00 on 24 Oct</p>
          <div class="flex gap-2 mt-4">${btn("Record payment…")}${btn("Add adjustment…", "outline")}</div>`,
          "col-span-2",
        );
        const priceCard = card(
          `<h2 class="text-lg font-semibold">Price</h2><p class="text-muted-foreground">Autumn 2026</p><p class="mt-2">B1 Evening: group price</p><p class="tnum text-muted-foreground">€15.00 per lesson</p><p class="mt-2">Conversation Club: course price</p><p class="tnum text-muted-foreground">€48.00 per term</p><div class="mt-4">${btn("Set student price…", "outline")}</div>`,
        );
        let menu = "";
        if (st === 2)
          menu = `<div class="absolute right-10 top-[190px] w-48 rounded-md border border-border bg-white shadow-lg py-1 z-10" role="menu"><p class="px-3 py-1 text-xs text-muted-foreground">Lesson line</p>${["Waive…", "History"].map((t) => `<div role="menuitem" class="px-3 py-1.5 hover:bg-muted">${t}</div>`).join("")}<p class="px-3 py-1 text-xs text-muted-foreground border-t border-border mt-1">Payment row</p>${["Edit…", "Refund…", "Void payment…", "History"].map((t) => `<div role="menuitem" class="px-3 py-1.5 hover:bg-muted">${t}</div>`).join("")}</div>`;

          "Based on reported absences. Attendance is not taken in class.",
          filters,
          st === 1
            ? `<div class="grid grid-cols-4 gap-4">${skel(4, "h-20")}</div>`

          body,
          "",
          exportBtn(false),
          st === 0 ? untilToday : "",

      }
      function hours(st) {
        const filters =
          sel("Period", st === 2 ? "Custom dates…" : "Term: Autumn 2026") +

            ? `<label class="inline-flex flex-col gap-1"><span class="text-xs font-medium text-muted-foreground">Dates</span><span class="h-9 px-3 rounded-md border border-red-600 bg-white inline-flex items-center">1 Jan 2026 – 31 Mar 2027</span><span class="text-xs text-red-700">Choose a period of at most 366 days.</span></label>`
            : "") +
          sel("Teacher", st === 1 ? "Ana Kral" : "Any") +
          sel("Group", "Any");
        const stats = `<dl class="grid grid-cols-3 gap-4">${stat("Total hours", "412 h 30 min")}${stat("Lessons", "275")}${stat("Substitute hours", "18 h")}</dl>`;
        let body;
        if (st === 1)
          body = card(
            `<h2 class="text-lg font-semibold mb-3">Ana Kral — lessons</h2>` +
              table(
                [
                  { t: "Date" },
                  { t: "Time" },
                  { t: "Group" },
                  { t: "Level" },
                  { t: "Room" },
                  { t: "Role" },
                  { t: "Duration", r: 1 },
                ],
                [
                  [
                    "Mon 13 Oct",
                    "17:00–18:30",
                    "B1 Evening",
                    "B1",
                    "Room 3",
                    `<span class="text-cyan-900">⚙ Substitute for Tomas Horvat</span>`,
                    "1 h 30 min",
                  ],
                  [
                    "Tue 14 Oct",
                    "09:00–10:30",

                    "A2",

                    "Wed 15 Oct",
                    "18:00–19:00",

                    "Room 5",
                    "Regular",
                    "1 h",

            table(
              [
                { t: "Teacher" },
                { t: "Lessons", r: 1 },
                { t: "Regular", r: 1 },
                { t: "As substitute", r: 1 },
                { t: "Total", r: 1 },
                { t: "Covered by others", r: 1 },
              ],
              [
                [
                  a("Ana Kral"),
                  "62",
                  "84 h",

                  "<strong>93 h</strong>",
                  "<span class='text-muted-foreground'>0 h</span>",
                ],
                [

                  "54",
                  "76 h 30 min",
                  "0 h",
                  "<strong>76 h 30 min</strong>",
                  "<span class='text-muted-foreground'>6 h</span>",
                ],
                [
                  a("Eva Simon") + " " + badge("Archived"),

                  "40 h 30 min",
                  "<span class='text-cyan-900'>⚙ 4 h 30 min</span>",
                  "<strong>45 h</strong>",
                  "<span class='text-muted-foreground'>0 h</span>",

                foot: [

            "p-4",
          );
        const exportMenu =
          st === 3
            ? `<div class="relative">${exportBtn(true)}<div role="menu" class="absolute right-0 mt-1 w-44 rounded-md border border-border bg-white shadow-lg py-1 z-10">${["Summary", "Lesson details"].map((t) => `<div role="menuitem" class="px-3 py-1.5 hover:bg-muted">${t}</div>`).join("")}</div></div>`
            : exportBtn(true);
        return reportShell(
          "Teacher hours",
          "Hours each teacher taught. Substitute hours count for the substitute.",
          filters,
          stats,
          body,
          "Only lessons that have ended count. Cancelled lessons don't. Covered by others isn't in the total.",
          exportMenu,
        );
      }
      function revenue(st) {
        const filters = sel("Period", "Term: Autumn 2026");
        const s = (l, v, h) =>
          `<div class="rounded-lg border border-border bg-white p-4"><dt class="text-muted-foreground">${l}</dt><dd class="text-2xl font-semibold tnum mt-1">${v}</dd><dd class="text-xs text-muted-foreground mt-1">${h}</dd></div>`;
        const stats = `<dl class="grid grid-cols-4 gap-4">${s("Billed", "€18,240.00", "Lesson, term and adjustment lines dated in this period.")}${s("Collected", "€15,060.00", "Payments received in this period.")}${s("Refunded", "€100.00", "Refunds paid out in this period.")}${s("Net collected", "€14,960.00", "Collected minus refunded.")}</dl>`;
        const tooMany =
          st === 1
            ? alert(
                "⚠ This export would have 61,240 rows. The limit is 50,000. Choose a shorter period or add a filter.",
                "warning",
              )
            : "";
        const body =
          (st === 2
            ? card(
                empty(
                  "📊",
                  "No data for this period.",
                  "Try another term or dates.",
                ),
              )
            : card(
                table(
                  [
                    { t: "Month" },
                    { t: "Lessons", r: 1 },
                    { t: "Term fees", r: 1 },
                    { t: "Adjustments", r: 1 },
                    { t: "Billed total", r: 1 },
                    { t: "Collected", r: 1 },
                    { t: "Refunded", r: 1 },
                    { t: "Net collected", r: 1 },

                  [

                      "September 2026",

                      "€100.00",

                    foot: [
                      "Total",
                      "€6,480.00",
                      "€11,760.00",
                      "€0.00",
                      "€18,240.00",
                      "€15,060.00",
                      "€100.00",
                      "€14,960.00",

                  },
                ),
                "p-4",
              )) +
          `<p>${a("Who owes money? Open the Outstanding report ›")}</p>`;
        return reportShell(
          "Revenue",
          "What was billed and collected, month by month.",
          filters,
          st === 2 ? "" : stats,
          tooMany + body,
          "Voided entries aren't counted. Amounts in EUR.",
          exportBtn(false),
        );
      }
      function outstanding(st) {
        const filters =
          sel("Group members in", "Autumn 2026") +
          sel("Group", "Any") +
          sel("Status", st === 1 ? "Overdue" : "Owing");
        const stats = `<dl class="grid grid-cols-4 gap-4">${stat("Owed", "€3,420.00")}${stat("Overdue", "€1,260.00")}${stat("Students", "23")}${stat("In credit", "€140.00")}</dl>`;
        const rows = [
          [
            a("Jana Kovac"),
            "jana@…",
            "B1 Evening",
            "€240.00",
            "€0.00",
            "Owes €240.00",
            "€120.00",
            "14 Sep",
            "—",
            STATUS.OVERDUE(),
          ],
          [
            a("Eva Lukac"),
            "eva@…",
            "B1 Evening; C1 Business",
            "€390.00",
            "€300.00",
            "Owes €90.00",
            "€30.00",
            "29 Sep",
            "8 Oct",
            STATUS.OVERDUE(),
          ],
          [
            a("Petr Hruby"),
            "petr@…",
            "A2 Morning",
            "€180.00",
            "€100.00",
            "Owes €80.00",

            "—",
            "3 Oct",
            STATUS.DUE(),

          `<a href="#" class="text-primary">‹ Reports</a>` +
            pageHeader(
              "Outstanding",
              exportBtn(false),
              "Students with a balance right now. Balances as of 16 Oct 2026, 14:05.",
            ) +
            `<div class="flex flex-wrap items-end gap-3">${filters}</div>` +
            stats +
            card(
              table(
                [
                  { t: "Student" },
                  { t: "Email" },
                  { t: "Groups" },
                  { t: "Charged", r: 1 },
                  { t: "Paid (net)", r: 1 },
                  { t: "Balance", r: 1 },
                  { t: "Overdue ↓", r: 1 },
                  { t: "Oldest overdue" },
                  { t: "Last payment" },
                  { t: "Status" },

                st === 1 ? rows.slice(0, 2) : rows,
              ),
              "p-4",

        );
      }

      /* --------------------------------------------------------- settings */
      function settings() {
        return desktop(
          pageHeader("Payments", "", "Settings") +
            card(`<div class="max-w-2xl space-y-4">
              ${field("Currency", "EUR — Euro <span class='ml-auto'>🔒</span>", "<p class='text-xs text-muted-foreground'>The currency can't change once prices, charges or payments exist.</p>")}
              ${field("Payment term", "14 <span class='ml-auto text-muted-foreground'>days</span>", "<p class='text-xs text-muted-foreground'>Each line is due this many days after it's posted. A change applies to lines posted from now on.</p>")}
              <div class="space-y-1"><label class="font-medium block">Payment instructions for students <span class="text-xs text-muted-foreground">(Q5)</span></label><textarea class="w-full h-24 rounded-md border border-input p-2">Pay at the office (Mon–Fri 9:00–18:00) or by bank transfer to SK12 1100 0000 0026 1234 5678. Reference: your full name.</textarea><p class="text-xs text-muted-foreground">Shown on the students' Payments page, e.g. your bank account and what to write as the reference.</p></div>
              ${btn("Save changes")}</div>`),
          "Settings",
        );
      }

      /* ----------------------------------------------------------- screens */
      const SCREENS = [
        {
          k: "bal",
          label: "Balances",
          states: [
            "owing",
            "loading",
            "no prices",
            "nobody owes",
            "error",
            "all students",
          ],
          fn: balances,
        },
        {
          k: "rec",
          label: "Record payment",
          states: ["full", "partial", "over → credit", "error"],
          fn: recordDialog,
        },
        {
          k: "stmt",
          label: "Student › Payments",
          states: [
            "statement",
            "show voided",
            "row menus",
            "upcoming open",
            "loading",
          ],
          fn: studentPage,
        },
        {
          k: "fix",
          label: "Edit / refund / void / waive / adjust",
          states: [
            "edit payment",
            "refund",
            "refund over credit",
            "void",
            "void blocked",
            "waive",
            "adjustment",
            "history sheet",
          ],
          fn: fixDialogs,
        },
        {
          k: "jr",
          label: "Payments journal",
          states: ["list", "empty"],
          fn: journal,
        },
        {
          k: "pr",
          label: "Prices",
          states: [
            "list + needs pricing",
            "set price + preview",
            "preview out of date",
            "copy prices",
            "no term",
            "copy blocked",
          ],
          fn: (s) => (s === 5 ? copyBlocked() : prices(s)),
        },
        {
          k: "set",
          label: "Settings › Payments",
          states: ["form"],
          fn: settings,
        },
        {
          k: "stu",
          label: "Student payments (mobile)",
          states: [
            "due",
            "overdue",
            "settled",
            "in credit",
            "loading",
            "empty",
            "error",
            "payments tab",
            "home card + More",
          ],
          fn: (s) =>
            s === 7
              ? studentPaymentsTab()
              : s === 8
                ? studentHome()
                : studentPayments(s),
        },
        { k: "ri", label: "Reports", states: ["index"], fn: reportsIndex },
        {
          k: "ra",
          label: "Attendance",
          states: ["table (until today)", "loading", "no data"],
          fn: attendance,
        },
        {
          k: "rh",
          label: "Teacher hours",
          states: [
            "summary",
            "teacher detail",
            "range too long",
            "export menu",
          ],
          fn: hours,
        },
        {
          k: "rr",
          label: "Revenue",
          states: ["by month", "too many rows", "no data"],
          fn: revenue,
        },
        {
          k: "ro",
          label: "Outstanding",
          states: ["owing", "overdue"],
          fn: outstanding,
        },
        {
          k: "403",
          label: "403 (teacher)",
          states: ["forbidden"],
          fn: forbidden,
        },
      ];
      let cur = { screen: "bal", state: 0 };
      function render() {
        const s = SCREENS.find((x) => x.k === cur.screen);
        document.getElementById("wf-screens").innerHTML = SCREENS.map(
          (x) =>
            `<button data-go="${x.k}" class="px-2 py-1 rounded ${x.k === cur.screen ? "bg-white text-slate-900 font-medium" : "bg-slate-700 hover:bg-slate-600"}">${x.label}</button>`,
        ).join("");
        document.getElementById("wf-states").innerHTML = s.states
          .map(
            (st, i) =>
              `<button data-state="${i}" class="px-2 py-1 rounded ${i === cur.state ? "bg-blue-500 text-white" : "bg-slate-700 hover:bg-slate-600"}">${st}</button>`,
          )
          .join("");
        document.getElementById("stage").innerHTML = s.fn(cur.state);
      }
      document.addEventListener("click", (e) => {
        const go = e.target.closest("[data-go]"),
          st = e.target.closest("[data-state]");
        if (go) {
          e.preventDefault();
          cur = { screen: go.dataset.go, state: 0 };
        } else if (st) cur.state = +st.dataset.state;
        else return;
        render();
      });
      render();
    </script>
  </body>
</html>
