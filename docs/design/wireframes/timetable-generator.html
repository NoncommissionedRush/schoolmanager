<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wireframe — Timetable generator (CARM-49)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              background: "#ffffff",
              foreground: "#0f172a",
              muted: { DEFAULT: "#f1f5f9", foreground: "#475569" },
              primary: { DEFAULT: "#2563eb", foreground: "#ffffff" },
              accent: { DEFAULT: "#eff6ff", foreground: "#1e40af" },
              destructive: { DEFAULT: "#dc2626", foreground: "#ffffff" },
              border: "#e2e8f0",
              input: "#64748b",
              ring: "#2563eb",
            },
            borderRadius: { lg: "0.5rem", md: "6px", sm: "4px" },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .tnum {
        font-variant-numeric: tabular-nums;
      }
      .skeleton {
        background: #e2e8f0;
        border-radius: 4px;
      }
      .lg-group {
        background: #eff6ff;
        border-left: 3px solid #2563eb;
        color: #1e3a8a;
      }
      .lg-one {
        background: #f5f3ff;
        border-left: 3px solid #7c3aed;
        color: #4c1d95;
      }
      .draft-band {
        background: #3730a3;
        color: #ffffff;
      }
      .draft-frame {
        border: 2px dashed #4f46e5;
      }
      .diff-new {
        outline: 2px solid #15803d;
        outline-offset: -2px;
      }
      .diff-moved {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
      }
      .diff-removed {
        background: #f8fafc;
        border: 1px dashed #94a3b8;
        color: #475569;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-slate-200 font-sans text-sm text-foreground">
    <div
      class="sticky top-0 z-50 flex flex-wrap items-center gap-x-4 gap-y-2 bg-slate-900 px-4 py-2 text-xs text-slate-100"
    >
      <strong class="text-sm">Wireframe · Timetable generator</strong>
      <div class="flex flex-wrap gap-1" id="wf-screens"></div>
      <div class="flex items-center gap-1">
        <span class="text-slate-400">State:</span>
        <div class="flex flex-wrap gap-1" id="wf-states"></div>
      </div>
    </div>
    <div id="stage" class="flex justify-center p-6"></div>

    <script>
      /* --------------------------------------------------------------- helpers */
      const HOUR = 44; // px per hour in the wireframe (64 in product)
      const START = 8,
        END = 21;
      const btn = (label, v = "primary", extra = "") => {
        const c = {
          primary: "bg-primary text-white hover:bg-blue-700",
          outline: "border border-input bg-white hover:bg-muted",
          ghost: "hover:bg-muted",
          destructive: "bg-destructive text-white",
          link: "text-primary underline-offset-2 hover:underline px-0",
        }[v];
        return `<button class="h-9 px-3 rounded-md font-medium inline-flex items-center gap-2 ${c} ${extra}">${label}</button>`;
      };
      const badge = (t, tone = "muted") => {
        const c = {
          muted: "bg-slate-100 text-slate-700 border-slate-300",
          success: "bg-green-50 text-green-700 border-green-300",
          warning: "bg-amber-50 text-amber-700 border-amber-300",
          danger: "bg-red-50 text-red-700 border-red-300",
          info: "bg-blue-50 text-blue-700 border-blue-300",
          draft: "bg-indigo-50 text-indigo-900 border-indigo-300",
        }[tone];
        return `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-xs font-medium rounded-sm border whitespace-nowrap ${c}">${t}</span>`;
      };
      const alert = (title, body, tone = "info", actions = "") => {
        const c = {
          info: "border-blue-300 bg-blue-50 text-blue-900",
          warning: "border-amber-300 bg-amber-50 text-amber-900",
          danger: "border-red-300 bg-red-50 text-red-900",
          success: "border-green-300 bg-green-50 text-green-900",
          muted: "border-slate-300 bg-slate-50 text-slate-800",
        }[tone];
        return `<div role="${tone === "danger" ? "alert" : "status"}" class="rounded-lg border p-3 ${c}"><p class="font-semibold">${title}</p>${body ? `<p class="mt-1">${body}</p>` : ""}${actions ? `<div class="mt-2 flex flex-wrap gap-2">${actions}</div>` : ""}</div>`;
      };
      const sel = (label, value, w = "w-full") =>
        `<div class="space-y-1"><label class="block font-medium">${label}</label><button class="h-9 ${w} rounded-md border border-input bg-white px-3 text-left">${value} ▾</button></div>`;
      const radio = (label, checked, hint = "") =>
        `<label class="flex items-start gap-2"><span class="mt-0.5 w-4 h-4 rounded-full border border-input grid place-items-center">${checked ? '<span class="w-2 h-2 rounded-full bg-primary"></span>' : ""}</span><span>${label}${hint ? `<span class="block text-muted-foreground">${hint}</span>` : ""}</span></label>`;
      const check = (label, checked) =>
        `<label class="flex items-center gap-2"><span class="w-4 h-4 rounded-sm border border-input grid place-items-center text-[10px] ${checked ? "bg-primary text-white border-primary" : ""}">${checked ? "✓" : ""}</span>${label}</label>`;
      const dialog = (title, body, footer, w = "max-w-lg") => `
        <div class="absolute inset-0 bg-black/50 grid place-items-center p-6 z-30">
          <div role="dialog" aria-modal="true" aria-label="${title}" class="bg-white rounded-lg shadow-lg w-full ${w} p-6 max-h-full overflow-auto">
            <div class="flex items-start justify-between mb-4"><h2 class="text-lg font-semibold">${title}</h2><button aria-label="Close" class="w-8 h-8 rounded-md hover:bg-muted">✕</button></div>
            <div class="space-y-4">${body}</div>
            <div class="flex justify-end gap-2 mt-6">${footer}</div>
          </div>
        </div>`;
      const sheet = (title, body, footer, w = "w-[480px]") => `
        <div class="absolute inset-0 bg-black/40 z-30 flex justify-end">
          <aside role="dialog" aria-modal="true" aria-label="${title}" class="bg-white h-full ${w} shadow-lg flex flex-col">
            <div class="flex items-center justify-between px-5 h-14 border-b border-border"><h2 class="font-semibold text-base">${title}</h2><button aria-label="Close" class="w-8 h-8 rounded-md hover:bg-muted">✕</button></div>
            <div class="flex-1 overflow-auto p-5 space-y-4">${body}</div>
            <div class="flex justify-end gap-2 px-5 py-3 border-t border-border">${footer}</div>
          </aside>
        </div>`;
      const toast = (text, action = "") =>
        `<div role="status" class="absolute bottom-4 right-4 z-40 bg-white border border-border shadow-lg rounded-lg px-4 py-3 flex items-center gap-4 max-w-md"><span>${text}</span>${action ? `<button class="font-medium text-primary">${action}</button>` : ""}</div>`;

      /* ------------------------------------------------------------ app shell */
      const shell = (content, overlay = "") => `
        <div class="relative w-[1280px] min-h-[820px] bg-white border border-slate-300 shadow-xl flex">
          <nav aria-label="Main" class="w-56 shrink-0 border-r border-border bg-white p-3 space-y-1 text-sm">
            <div class="font-semibold px-2 py-2">Lingua Language School</div>
            <a class="block px-2 py-1.5 rounded-md hover:bg-muted" href="#">▦ Dashboard</a>
            <p class="px-2 pt-3 pb-1 text-xs text-muted-foreground font-medium">Schedule</p>
            <a class="block px-2 py-1.5 rounded-md hover:bg-muted" href="#">📅 Timetable</a>
            <a class="block px-2 py-1.5 rounded-md hover:bg-muted" href="#">📝 Lesson log</a>
            <a class="block px-2 py-1.5 rounded-md hover:bg-muted" href="#">📆 Absences & replacements</a>
            <a class="flex items-center gap-2 px-2 py-1.5 rounded-md bg-accent text-accent-foreground font-medium" aria-current="page" href="#">✨ Auto-generate ${cur.running ? '<span class="ml-auto animate-spin">◌</span><span class="sr-only">Generating</span>' : ""}</a>
            <p class="px-2 pt-3 pb-1 text-xs text-muted-foreground font-medium">People</p>
            <a class="block px-2 py-1.5 rounded-md hover:bg-muted" href="#">🎓 Students</a>
            <a class="block px-2 py-1.5 rounded-md hover:bg-muted" href="#">👩‍🏫 Teachers</a>
            <p class="px-2 pt-3 pb-1 text-xs text-muted-foreground font-medium">Academics</p>
            <a class="block px-2 py-1.5 rounded-md hover:bg-muted" href="#">📘 Courses & groups</a>
          </nav>
          <main class="flex-1 min-w-0 bg-muted p-6 space-y-4">${content}</main>
          ${overlay}
        </div>`;

      const STEP_STATUS = {
        demand: ["Weekly needs", "58 of 60 groups ready"],
        run: ["Generate", "Run 3 · 238 of 244 lessons placed"],
        review: ["Review & publish", "Generated draft · 4 changes by hand"],
      };
      const header = (step, status = {}) => {
        const st = { ...STEP_STATUS };
        Object.entries(status).forEach(([k, v]) => (st[k] = [st[k][0], v]));
        return `
        <div class="flex items-center gap-3"><h1 class="text-2xl font-semibold">Generate timetable</h1></div>
        <div class="flex items-center gap-3">${sel("", "Term: Spring 2027", "w-64").replace('<label class="block font-medium"></label>', "")} ${badge("Draft")}</div>
        <nav aria-label="Steps" class="bg-white border border-border rounded-lg p-2 flex gap-2">
          ${["demand", "run", "review"]
            .map(
              (k, i) =>
                `<a href="#" data-go="${k === "demand" ? "demand" : k === "run" ? "run" : "review"}" ${k === step ? 'aria-current="step"' : ""} class="flex-1 rounded-md px-3 py-2 flex items-center gap-3 ${k === step ? "bg-accent text-accent-foreground" : "hover:bg-muted"}"><span class="w-7 h-7 rounded-full grid place-items-center font-semibold ${k === step ? "bg-primary text-white" : "bg-slate-200"}">${i + 1}</span><span><span class="block font-medium">${st[k][0]}</span><span class="block text-xs text-muted-foreground">${st[k][1]}</span></span></a>`,
            )
            .join('<span class="self-center text-slate-400">›</span>')}
        </nav>`;
      };

      /* ------------------------------------------------------ ① Weekly needs */
      const ROWS = [
        // group, type, level, members, lessons, len, teacher, room, times, status
        [
          "A1 Beginners Mon/Wed",
          "g",
          "A1",
          "9 / 12",
          "2",
          "90",
          "Ana Kral",
          "Physical ≥ 9",
          "Mon–Fri 16:00–21:00",
          ["Ready", "success", "✓"],
        ],
        [
          "A2 Kids",
          "g",
          "A2",
          "6 / 10",
          "3",
          "45",
          "Any A2 teacher",
          "Physical ≥ 6",
          "Mon–Fri 14:00–18:00",
          ["Teacher nearly full", "warning", "⚠"],
        ],
        [
          "A2 Morning",
          "g",
          "A2",
          "8 / 10",
          "2",
          "90",
          "Ana Kral",
          "Physical ≥ 8",
          "Mon–Fri 08:00–12:00",
          ["Ready", "success", "✓"],
        ],
        [
          "B1 Evening",
          "g",
          "B1",
          "8 / 10",
          "2",
          "90",
          "Tomas Horvat",
          "Physical ≥ 8",
          "📌 Mon 17:00 · Any",
          ["Ready", "success", "✓"],
        ],
        [
          "B1 Grammar 1-on-1",
          "o",
          "B1",
          "1 / 1",
          "1",
          "60",
          "Tomas Horvat",
          "Either",
          "Any",
          ["Ready", "success", "✓"],
        ],
        [
          "B2 Conversation",
          "g",
          "B2",
          "10 / 10",
          "2",
          "90",
          "Eva Simon",
          "Physical ≥ 10",
          "Any",
          ["Ready", "success", "✓"],
        ],
        [
          "C1 Business",
          "g",
          "C1",
          "14 / 14",
          "2",
          "90",
          "Peter Varga",
          "Physical ≥ 14",
          "Any",
          ["No room big enough", "danger", "⛔"],
        ],
        [
          "Jan Novak 1-on-1",
          "o",
          "A2",
          "1 / 1",
          "1",
          "45",
          "Any A2 teacher",
          "Online",
          "📌 Tue 18:00",
          ["Ready", "success", "✓"],
        ],
        [
          "A1 Teens (new)",
          "g",
          "A1",
          "6 / 12",
          "—",
          "—",
          "—",
          "—",
          "—",
          ["Incomplete", "muted", "◌"],
        ],
        [
          "B2 Old group",
          "g",
          "B2",
          "0 / 10",
          "",
          "",
          "",
          "",
          "",
          ["Left out", "muted", "⊘"],
        ],
      ];
      const cellSel = (v) =>
        `<button class="h-8 min-w-[56px] whitespace-nowrap rounded-md border border-input bg-white px-2 text-left tnum">${v || "—"} ▾</button>`;
      function demandTable(selected = []) {
        return `<div class="bg-white border border-border rounded-lg overflow-hidden">
          <table class="w-full text-left">
            <thead class="bg-muted text-xs text-muted-foreground"><tr>
              <th class="p-2 w-8"><span class="sr-only">Select</span>${selected.length ? '<span class="w-4 h-4 inline-block rounded-sm border border-primary bg-primary text-white text-[10px] text-center" aria-checked="mixed">–</span>' : '<span class="w-4 h-4 inline-block rounded-sm border border-input"></span>'}</th>
              <th class="p-2">Group ↑</th><th class="p-2">Lessons</th><th class="p-2">Length</th><th class="p-2">Teacher</th><th class="p-2">Room</th><th class="p-2">Days & times</th><th class="p-2">Status</th><th class="p-2"><span class="sr-only">Actions</span></th></tr></thead>
            <tbody>${ROWS.map((r, i) => {
              const [g, k, l, m, n, len, t, room, times, s] = r;
              const out = s[0] === "Left out";
              const isSel = selected.includes(i);
              return `<tr class="border-t border-border ${isSel ? "bg-accent" : ""} ${out ? "text-muted-foreground" : ""}">
                <td class="p-2"><span class="w-4 h-4 inline-block rounded-sm border ${isSel ? "border-primary bg-primary text-white text-[10px] text-center" : "border-input"}">${isSel ? "✓" : ""}</span></td>
                <td class="p-2"><a href="#" class="font-medium hover:underline">${k === "g" ? "👥" : "👤"} ${g}</a> <span class="ml-1">${badge(l)}</span><span class="block text-xs text-muted-foreground tnum">${m} members</span></td>
                ${out ? `<td colspan="5" class="p-2 italic">Left out of generation</td>` : `<td class="p-2">${cellSel(n)}</td><td class="p-2">${cellSel(len && len !== "—" ? len + " min" : "")}</td><td class="p-2">${cellSel(t)}</td><td class="p-2">${room}</td><td class="p-2">${times}</td>`}
                <td class="p-2">${badge(s[2] + " " + s[0], s[1])}</td>
                <td class="p-2"><button aria-label="Actions for ${g}" class="w-8 h-8 rounded-md hover:bg-muted">⋯</button></td></tr>`;
            }).join("")}</tbody>
          </table>
          <div class="border-t border-border px-3 py-2 text-xs text-muted-foreground flex justify-between tnum"><span>60 groups · 116 lessons a week · 168 teaching hours · 20 teachers</span><a href="#" class="text-primary">Teacher load</a></div>
        </div>`;
      }
      const demandToolbar = (selected = 0) => `
        <div class="flex items-center gap-2 flex-wrap">
          <input class="h-9 w-56 rounded-md border border-input px-3" placeholder="Search groups" aria-label="Search groups" />
          ${["Type: All", "Level: All", "Teacher: Any", "Status: All"].map((x) => `<button class="h-9 rounded-md border border-input bg-white px-3">${x} ▾</button>`).join("")}
          <div class="ml-auto flex items-center gap-2">
            ${
              selected
                ? `<div role="region" aria-label="Bulk actions" class="flex items-center gap-2 bg-accent rounded-md px-2 py-1"><span aria-live="polite" class="font-medium">${selected} selected</span>${btn("Edit selected…", "outline")}${btn("Leave out", "ghost")}${btn("Include", "ghost")}${btn("Clear selection", "ghost")}</div>`
                : `${btn("Copy from another term…", "outline")}${btn("Defaults…", "outline")}<span class="text-xs text-muted-foreground tnum">55 ready · 1 with problems · 3 incomplete · 1 left out</span>${btn("Generate ▸")}`
            }
          </div>
        </div>`;

      function demand(st) {
        const name = DEMAND_STATES[st];
        if (name === "loading")
          return shell(
            header("demand") +
              `<div class="bg-white border border-border rounded-lg p-4 space-y-3">${Array.from({ length: 8 }, () => `<div class="skeleton h-8"></div>`).join("")}</div>`,
          );
        if (name === "empty")
          return shell(
            header("demand", { demand: "Not started" }) +
              demandToolbar() +
              `<div class="bg-white border border-border rounded-lg p-12 text-center space-y-3"><div class="text-4xl text-muted-foreground">✨</div><h2 class="text-lg font-semibold">No weekly needs yet</h2><p class="text-muted-foreground">Say how many lessons each group needs a week. Copy last term to start quickly.</p><div class="flex justify-center gap-2">${btn("Copy from Autumn 2026")}${btn("Fill in by hand", "outline")}</div></div>`,
          );
        if (name === "load error")
          return shell(
            header("demand") +
              alert(
                "Couldn't load the weekly needs",
                "Check your connection and try again.",
                "danger",
                btn("Try again", "outline"),
              ),
          );
        const selected =
          name === "bulk selection" || name === "bulk edit sheet"
            ? [1, 2, 7]
            : [];
        let overlay = "";
        if (name === "row sheet") overlay = rowSheet();
        if (name === "bulk edit sheet") overlay = bulkSheet();
        if (name === "copy from term") overlay = copyDialog();
        if (name === "problem row (sheet)") overlay = rowSheet(true);
        if (name === "teacher load")
          return shell(
            header("demand") + demandToolbar() + teacherLoad() + demandTable(),
          );
        const extra =
          name === "missing basics"
            ? alert(
                "To generate a timetable you need groups with members, teachers and rooms.",
                "",
                "info",
                `<a href="#" class="text-primary font-medium">Rooms</a>`,
              )
            : "";
        return shell(
          header("demand") +
            extra +
            demandToolbar(selected.length) +
            demandTable(selected) +
            (name === "bulk saved" ? toast("Updated 3 groups.", "Undo") : ""),
          overlay,
        );
      }
      function teacherLoad() {
        const T = [
          ["Tomas Horvat", 22, 20, "warning", "Over by 2 h"],
          ["Ana Kral", 18, 26, "success", "OK"],
          ["Eva Simon", 12, 30, "success", "OK"],
          ["Peter Varga", 9, 10, "warning", "Nearly full"],
        ];
        return `<section class="bg-white border border-border rounded-lg p-4"><div class="flex items-center justify-between mb-2"><h2 class="font-semibold">Teacher load</h2><span class="text-xs text-muted-foreground">Flexible hours: 34 h across 6 teachers</span></div>
          <table class="w-full text-left"><thead class="text-xs text-muted-foreground"><tr><th class="py-1">Teacher</th><th>Asked</th><th>Available</th><th class="w-1/3"><span class="sr-only">Load</span></th><th>Status</th></tr></thead><tbody>
          ${T.map(([n, a, v, tone, s]) => `<tr class="border-t border-border"><td class="py-1.5">${n}</td><td class="tnum">${a} h asked</td><td class="tnum">${v} h available</td><td><div aria-hidden="true" class="h-2 rounded bg-slate-100"><div class="h-2 rounded ${tone === "warning" ? "bg-amber-500" : "bg-green-600"}" style="width:${Math.min(100, (a / v) * 100)}%"></div></div></td><td>${badge(s, tone)}</td></tr>`).join("")}
          </tbody></table></section>`;
      }
      function rowSheet(problem = false) {
        const g = problem ? "C1 Business" : "B1 Evening";
        return sheet(
          `${g} — weekly needs`,
          `<div class="rounded-md bg-muted p-3 text-sm space-y-1"><div>${badge("👥 Group lesson")} ${badge(problem ? "C1" : "B1")} <span class="tnum">${problem ? "14 / 14" : "8 / 10"} members</span></div><div class="text-muted-foreground">Last term: 2 × 90 min, ${problem ? "Peter Varga" : "Tomas Horvat"}, Mon & Wed 17:00</div></div>
          ${problem ? alert("⛔ No physical room has 14 seats. The biggest is Room 3 (12).", "", "danger", `<a href="#" class="text-primary font-medium">Rooms ↗</a><a href="#" class="text-primary font-medium">Allow online</a>`) : ""}
          <div class="flex items-center justify-between"><span class="font-medium">Include in generation</span><span class="w-9 h-5 rounded-full bg-primary relative"><span class="absolute right-0.5 top-0.5 w-4 h-4 rounded-full bg-white"></span></span></div>
          <div class="grid grid-cols-2 gap-3">${sel("Lessons per week (required)", "2")}${sel("Length (required)", "90 min")}</div>
          <fieldset class="space-y-2"><legend class="font-medium mb-1">Teacher (required)</legend>${radio("This teacher", true)}<div class="pl-6">${sel("", problem ? "Peter Varga" : "Tomas Horvat").replace('<label class="block font-medium"></label>', "")}</div>${radio("Any suitable teacher", false, "Teaches " + (problem ? "C1" : "B1"))}${radio("One of these teachers", false)}</fieldset>
          <fieldset class="space-y-2"><legend class="font-medium mb-1">Room (required)</legend><div class="flex gap-4">${radio("Physical room", true)}${radio("Online room", false)}${radio("Either", false)}</div>
            <div class="space-y-1"><label class="block font-medium">Seats needed</label><input class="h-9 w-24 rounded-md border ${problem ? "border-red-600" : "border-input"} px-3 tnum" value="${problem ? 14 : 8}" /><p class="text-xs text-muted-foreground">${problem ? "14 members now · group capacity 14" : "8 members now · group capacity 10"}</p>${check("Plan for a full group (" + (problem ? 14 : 10) + ")", false)}</div>
            ${sel("Specific room", "Any room that fits")}${sel("Preferred rooms", "Room 1, Room 3")}</fieldset>
          <fieldset class="space-y-2"><legend class="font-medium mb-1">Days & times</legend>
            <div class="flex gap-1">${["Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d, i) => `<button aria-pressed="${i < 5}" class="h-8 px-2 rounded-md border ${i < 5 ? "bg-primary text-white border-primary" : "border-input"}">${d}</button>`).join("")}</div>
            <div class="flex items-end gap-2">${sel("Between", "16:00", "w-28")}<span class="pb-2">–</span>${sel("", "21:00", "w-28").replace('<label class="block font-medium"></label>', "")}</div>

            header("review") +
              band() +
              `<div class="bg-white border border-border rounded-lg p-4 space-y-3"><div class="skeleton h-8 w-1/2"></div><div class="skeleton h-[420px]"></div></div>`,
          );
        const compare = name === "compare" || name === "changes list";
        const stale = name === "out of date";
        let overlay = "";
        if (name === "slot sheet") overlay = draftSlotSheet();
        if (name === "regenerate") overlay = regenerateDialog();
        if (name === "issues · preferences") overlay = issuesSheet();
        if (name === "changes list") overlay = changesSheet();
        if (name === "publish") overlay = publishDialog("ok");
        if (name === "publish · unplaced") overlay = publishDialog("unplaced");
        if (name === "publish · blocked") overlay = publishDialog("blocked");
        if (name === "publish · published term")
          overlay = publishDialog("published");
        let extra = "";
        if (name === "moved & locked")
          extra = toast(
            "Moved B2 Conversation to Mon 16:00 and locked it.",
            "Undo",
          );
        if (name === "regenerated")
          extra = toast("Draft replaced by run 4.", "Undo");
        if (name === "published")
          return shell(
            header("review", { review: "Published 14 Oct" }) +
              alert(
                "Published 14 Oct 2026 from run 3",
                "Further changes are made in the timetable editor.",
                "success",
                btn("Open editor", "outline") +
                  btn("View published timetable", "outline"),
              ) +
              toast(
                "Spring 2027 published from the generated draft. 3,120 lessons created",
                "Open timetable",
              ),
          );
        return shell(
          header("review", stale ? { review: "Out of date" } : {}) +
            (name === "regenerated"
              ? alert(
                  "Run 4: 244 of 244 placed, score 1,120 (9 % better).",
                  "",
                  "success",
                )
              : "") +
            band(stale) +
            reviewToolbar(compare) +
            tray +
            draftGrid(compare) +
            extra,
          overlay,
        );
      }
      function draftSlotSheet() {
        return sheet(
          "Edit slot",
          `<div class="rounded-md bg-indigo-50 text-indigo-900 px-3 py-2 text-xs">✨ Generated draft — changes stay in the draft until you publish.</div>
          ${sel("Group (required)", "A2 Kids · A2 · 6 members")}${sel("Teacher (required)", "Ana Kral")}${sel("Room", "Room 3 · 12 seats")}
          <div class="grid grid-cols-3 gap-3">${sel("Day", "Monday")}${sel("Start", "14:00")}${sel("End", "14:45")}</div>
          <p class="text-muted-foreground">45 min · A2 Kids needs 3 × 45 min · <a href="#" class="text-primary">Edit needs</a></p>
          <div class="flex items-center justify-between rounded-md border border-border p-3"><span><span class="font-medium">🔒 Locked</span><span class="block text-xs text-muted-foreground">Kept where it is when you regenerate.</span></span><span class="w-9 h-5 rounded-full bg-slate-300 relative"><span class="absolute left-0.5 top-0.5 w-4 h-4 rounded-full bg-white"></span></span></div>
          <section aria-live="polite" class="space-y-2"><h3 class="font-semibold">Check</h3><p class="text-green-700">✓ No conflicts.</p>
            <h4 class="font-medium mt-2">Preferences ${badge("💡 Preference", "info")}</h4>
            <ul class="space-y-1 text-sm"><li>💡 Ana Kral has a 2 h gap before this lesson.</li><li>💡 A2 Kids also has a lesson the day before.</li></ul>
            <p class="text-xs text-muted-foreground">Preferences are information only. Nothing to acknowledge.</p></section>`,
          `<button class="mr-auto text-sm text-red-700">Remove from draft</button>${btn("Cancel", "outline")}${btn("Save slot")}`,
          "w-[420px]",
        );
      }
      function regenerateDialog() {
        return dialog(
          "Regenerate the unlocked slots?",
          `<p>12 locked slots stay where they are. The other 226 slots and the 6 lessons not placed are placed again.</p>
          <details class="rounded-md border border-border p-3"><summary class="font-medium cursor-pointer">Options</summary><p class="mt-2 text-muted-foreground">Time limit, preferences and variation, as when generating.</p></details>`,
          `${btn("Cancel", "outline")}${btn("Regenerate")}`,
        );
      }
      function issuesSheet() {
        return sheet(
          "Issues in the generated draft",
          `${sel("Preference", "All preferences")}
          <h3 class="font-semibold">Warnings ${badge("1", "warning")}</h3>
          <div class="rounded-md border border-border p-3"><p>⚠ <strong>C1 Prep · Mon 18:30</strong></p><p>Peter Varga is usually unavailable on Mondays 18:00–21:00.</p><div class="flex gap-2 mt-1">${btn("Show", "ghost", "h-8")}${btn("Edit", "ghost", "h-8")}</div></div>
          <h3 class="font-semibold">Preferences ${badge("14", "info")}</h3>
          ${[
            [
              "A2 Kids · Mon 14:00",
              "Ana Kral has a 2 h gap before this lesson.",
            ],
            [
              "A2 Kids · Mon 14:00",
              "A2 Kids also has a lesson the day before.",
            ],
            [
              "B1 Grammar 1-on-1 · Mon 10:00",
              "Not in a preferred room (Room 1).",
            ],
          ]
            .map(
              ([s, m]) =>
                `<div class="rounded-md border border-border p-3"><p>💡 <strong>${s}</strong></p><p>${m}</p>${btn("Show", "ghost", "h-8")}</div>`,
            )
            .join("")}`,
          btn("Close", "outline"),
        );
      }
      function changesSheet() {
        return sheet(
          "Changes compared to the current timetable",
          `<div class="flex gap-2">${btn("Changed only", "outline", "h-8")}${btn("By teacher", "outline", "h-8")}</div>
          <table class="w-full text-left text-xs"><thead class="text-muted-foreground"><tr><th class="py-1">Group</th><th>Was</th><th>Now</th><th>What changed</th></tr></thead><tbody>
          ${[
            [
              "B2 Conversation",
              "Mon 18:00, Room 2, Eva Simon",
              "Mon 16:00, Room 2, Eva Simon",
              "Time",
            ],
            [
              "C1 Business",
              "Tue 19:00, Room 3, Peter Varga",
              "Mon 19:00, Online 1, Peter Varga",
              "Day, room",
            ],
            ["A2 Kids", "—", "Mon 14:00, Room 3, Ana Kral", "New"],
            ["B2 Conversation", "Thu 18:00, Room 2, Eva Simon", "—", "Removed"],
          ]
            .map(
              ([g, w, n, c]) =>
                `<tr class="border-t border-border"><td class="py-2 font-medium">${g}</td><td>${w}</td><td>${n}</td><td>${c}</td></tr>`,
            )
            .join("")}</tbody></table>`,
          btn("Close", "outline"),
          "w-[640px]",
        );
      }
      function publishDialog(kind) {
        const published = kind === "published";
        let body = `<ul class="list-disc pl-5 space-y-1 tnum"><li>244 slots${published ? " · 38 changed, 4 new, 2 removed compared to the current timetable" : ""}</li>
          <li>${published ? "Changes apply from Mon 9 Nov 2026. Lessons before 9 Nov 2026 stay as they are." : "Lessons will be created from 1 Feb 2027 to 20 Jun 2027"}</li>
          ${published ? "<li>412 lessons created · 398 future lessons removed · 6 cancelled because they have history</li>" : ""}
          <li>1 warning acknowledged <a href="#" class="text-primary">Review</a></li></ul>`;
        if (kind === "unplaced")
          body +=
            alert(
              "6 lessons of 4 groups aren't placed.",
              "These groups will have fewer lessons than their weekly needs.",
              "warning",
            ) + check("Publish without them", false);
        if (kind === "blocked")
          body =
            alert(
              "Fix 2 conflicts before publishing.",
              "C1 Prep · Mon 18:30 — Room 3 is already used (A1 Beginners, added in the editor).<br/>A2 Kids · Wed 14:00 — Ana Kral already teaches then.",
              "danger",
            ) + body;
        body += `<p class="text-muted-foreground">${published ? "Teachers and students see the new timetable from 9 Nov 2026 right away. People with cancelled lessons are not notified automatically yet." : "Teachers and students will see their lessons right away. You can still change slots later; changes apply from a date you choose."}</p>`;
        return dialog(
          "Publish the generated draft for Spring 2027?",
          body,
          `${btn("Cancel", "outline")}${kind === "blocked" ? btn("Show issues") : btn("Publish timetable")}`,
        );
      }

      /* ---------------------------------------------------------------- render */
      const DEMAND_STATES = [
        "table",
        "loading",
        "empty",
        "missing basics",
        "row sheet",
        "problem row (sheet)",
        "bulk selection",
        "bulk edit sheet",
        "bulk saved",
        "copy from term",
        "teacher load",
        "load error",
      ];
      const RUN_STATES = [
        "no run yet",
        "options",
        "options · term has slots",
        "options · published term",
        "running · placing",
        "running · improving",
        "taking long",
        "result",
        "result · needs changed",
        "nothing placed",
        "run failed",
        "cancelled",
        "run history",
      ];
      const REVIEW_STATES = [
        "draft grid",
        "loading",
        "no draft",
        "slot sheet",
        "moved & locked",
        "compare",
        "changes list",
        "issues · preferences",
        "regenerate",
        "regenerated",
        "out of date",
        "publish",
        "publish · unplaced",
        "publish · blocked",
        "publish · published term",
        "published",
      ];
      const SCREENS = [
        {
          k: "demand",
          label: "① Weekly needs",
          states: DEMAND_STATES,
          fn: demand,
        },
        { k: "run", label: "② Generate", states: RUN_STATES, fn: run },
        {
          k: "review",
          label: "③ Review & publish",
          states: REVIEW_STATES,
          fn: review,
        },
      ];
      let cur = { screen: "demand", state: 0, running: false };
      function render() {
        const s = SCREENS.find((x) => x.k === cur.screen);
        document.getElementById("wf-screens").innerHTML = SCREENS.map(
          (x) =>
            `<button data-go="${x.k}" class="px-2 py-1 rounded ${x.k === cur.screen ? "bg-white text-slate-900 font-medium" : "bg-slate-700 hover:bg-slate-600"}">${x.label}</button>`,
        ).join("");
        document.getElementById("wf-states").innerHTML = s.states
          .map(
            (st, i) =>
              `<button data-state="${i}" class="px-2 py-1 rounded ${i === cur.state ? "bg-blue-500 text-white" : "bg-slate-700 hover:bg-slate-600"}">${st}</button>`,
          )
          .join("");
        document.getElementById("stage").innerHTML = s.fn(cur.state);
      }
      document.addEventListener("click", (e) => {
        const go = e.target.closest("[data-go]"),
          st = e.target.closest("[data-state]");
        if (go) {
          e.preventDefault();
          cur = { screen: go.dataset.go, state: 0, running: false };
        } else if (st) cur.state = +st.dataset.state;
        else return;
        render();
      });
      render();
    </script>
  </body>
</html>
