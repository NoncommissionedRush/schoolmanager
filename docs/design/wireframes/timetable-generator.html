<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wireframe — Assign teachers (timetable generator, CARM-54)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              background: "#ffffff",
              foreground: "#0f172a",
              muted: { DEFAULT: "#f1f5f9", foreground: "#475569" },
              primary: { DEFAULT: "#2563eb", foreground: "#ffffff" },
              accent: { DEFAULT: "#eff6ff", foreground: "#1e40af" },
              destructive: { DEFAULT: "#dc2626", foreground: "#ffffff" },
              border: "#e2e8f0",
              input: "#64748b",
              ring: "#2563eb",
            },
            borderRadius: { lg: "0.5rem", md: "6px", sm: "4px" },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .tnum {
        font-variant-numeric: tabular-nums;
      }
      .skeleton {
        background: #e2e8f0;
        border-radius: 4px;
      }
      .hatch {
        background: repeating-linear-gradient(
          135deg,
          #fde68a55 0 4px,
          transparent 4px 10px
        );
      }
      .lg-group {
        background: #eff6ff;
        border-left: 3px solid #2563eb;
        color: #1e3a8a;
      }
      .lg-one {
        background: #f5f3ff;
        border-left: 3px solid #7c3aed;
        color: #4c1d95;
      }
      .draft-outline {
        outline: 1px dashed #94a3b8;
        outline-offset: -1px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-slate-200 font-sans text-sm text-foreground">
    <div
      class="sticky top-0 z-50 flex flex-wrap items-center gap-x-4 gap-y-2 bg-slate-900 px-4 py-2 text-xs text-slate-100"
    >
      <strong class="text-sm">Wireframe · Assign teachers</strong>
      <div class="flex flex-wrap gap-1" id="wf-screens"></div>
      <div class="flex items-center gap-1">
        <span class="text-slate-400">State:</span>
        <div class="flex flex-wrap gap-1" id="wf-states"></div>
      </div>
    </div>
    <div id="stage" class="flex justify-center p-6"></div>

    <script>
      /* --------------------------------------------------------------- helpers */
      const btn = (label, v = "primary", extra = "") => {
        const c = {
          primary: "bg-primary text-white hover:bg-blue-700",
          outline: "border border-input bg-white hover:bg-muted",
          ghost: "hover:bg-muted",
          destructive: "bg-destructive text-white",
        }[v];
        return `<button class="h-9 px-3 rounded-md font-medium inline-flex items-center gap-2 ${c} ${extra}">${label}</button>`;
      };
      const badge = (t, tone = "muted") => {
        const c = {
          muted: "bg-slate-100 text-slate-700 border-slate-300",
          success: "bg-green-50 text-green-700 border-green-300",
          warning: "bg-amber-50 text-amber-700 border-amber-300",
          danger: "bg-red-50 text-red-700 border-red-300",
          info: "bg-blue-50 text-blue-700 border-blue-300",
        }[tone];
        return `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-xs font-medium rounded-sm border ${c}">${t}</span>`;
      };
      const alert = (tone, title, body = "", actions = "") => {
        const c = {
          warning: "bg-amber-50 border-amber-300 text-amber-900",
          danger: "bg-red-50 border-red-300 text-red-900",
          info: "bg-blue-50 border-blue-300 text-blue-900",
          success: "bg-green-50 border-green-300 text-green-900",
        }[tone];
        const icon = { warning: "⚠", danger: "⛔", info: "ℹ", success: "✓" }[
          tone
        ];
        return `<div role="${tone === "danger" ? "alert" : "status"}" class="rounded-lg border p-3 flex gap-3 ${c}"><span aria-hidden="true">${icon}</span><div class="flex-1"><div class="font-medium">${title}</div>${body ? `<div class="mt-1">${body}</div>` : ""}${actions ? `<div class="mt-2 flex flex-wrap gap-2">${actions}</div>` : ""}</div></div>`;
      };
      const sel = (label, value, w = "w-full") =>
        `<div class="space-y-1"><label class="block font-medium">${label}</label><button class="h-9 ${w} rounded-md border border-input bg-white px-3 text-left">${value} ▾</button></div>`;
      const dialog = (title, body, footer, w = "max-w-lg") => `
        <div class="absolute inset-0 bg-black/50 grid place-items-start justify-center p-10 z-30 overflow-auto">
          <div role="dialog" aria-modal="true" aria-label="${title}" class="bg-white rounded-lg shadow-lg w-full ${w} p-6">
            <div class="flex items-start justify-between mb-4"><h2 class="text-lg font-semibold">${title}</h2><button aria-label="Close" class="w-8 h-8 rounded-md hover:bg-muted">✕</button></div>
            <div class="space-y-4">${body}</div>
            <div class="flex justify-end gap-2 mt-6">${footer}</div>
          </div>
        </div>`;
      const sheet = (title, body, footer = "", w = 480) => `
        <div class="absolute inset-0 bg-black/50 z-30 flex justify-end">
          <aside role="dialog" aria-modal="true" aria-label="${title}" class="bg-white h-full shadow-lg flex flex-col" style="width:${w}px">
            <div class="flex items-center justify-between p-4 border-b border-border"><h2 class="text-lg font-semibold">${title}</h2><button aria-label="Close" class="w-8 h-8 rounded-md hover:bg-muted">✕</button></div>
            <div class="flex-1 overflow-auto p-4 space-y-4">${body}</div>
            ${footer ? `<div class="p-4 border-t border-border flex justify-end gap-2">${footer}</div>` : ""}
          </aside>
        </div>`;
      const toast = (text, action = "") =>
        `<div role="status" class="absolute bottom-4 right-4 z-40 bg-white border border-border shadow-lg rounded-lg px-4 py-3 flex items-center gap-4 max-w-md"><span>${text}</span>${action ? `<button class="font-medium text-primary underline">${action}</button>` : ""}</div>`;

      /* --------------------------------------------------------------- app shell */
      const shell = (content, overlay = "", active = "assign") => `
        <div class="relative bg-muted w-[1280px] min-h-[820px] rounded-lg overflow-hidden border border-slate-300 flex">
          <nav aria-label="Main" class="w-56 bg-white border-r border-border p-3 space-y-1 text-sm shrink-0">
            <div class="font-semibold px-2 py-2">Lingua School</div>
            <div class="px-2 pt-3 pb-1 text-xs text-muted-foreground uppercase">Schedule</div>
            <div class="px-2 py-1.5 rounded-md">📅 Timetable</div>
            <div class="px-2 py-1.5 rounded-md">🗓 Absences & replacements</div>
            <div class="px-2 py-1.5 rounded-md ${active === "assign" ? "bg-accent text-accent-foreground font-medium" : ""}" ${active === "assign" ? 'aria-current="page"' : ""}>✨ Assign teachers</div>
            <div class="px-2 pt-3 pb-1 text-xs text-muted-foreground uppercase">People</div>
            <div class="px-2 py-1.5">🎓 Students</div>
            <div class="px-2 py-1.5 rounded-md ${active === "teachers" ? "bg-accent text-accent-foreground font-medium" : ""}">🧑‍🏫 Teachers</div>
            <div class="px-2 pt-3 pb-1 text-xs text-muted-foreground uppercase">Academics</div>
            <div class="px-2 py-1.5 rounded-md ${active === "groups" ? "bg-accent text-accent-foreground font-medium" : ""}">📚 Courses & groups</div>
          </nav>
          <main class="flex-1 min-w-0 p-6 space-y-4">${content}</main>
          ${overlay}
        </div>`;

      const header = (o = {}) => {
        const termBadge = o.published
          ? badge("Published 1 Sep", "success")
          : badge("Draft term");
        const primary = o.noPrimary
          ? ""
          : btn(o.hasDraft ? "Reassign…" : "✨ Assign teachers…");
        return `
        <div class="flex items-center gap-3 flex-wrap">
          <h1 class="text-2xl font-semibold mr-4">Assign teachers</h1>
          <button class="h-9 rounded-md border border-input bg-white px-3">Term: ${o.term || "Spring 2027"} ▾</button>${termBadge}
          <div class="flex-1"></div>
          <button aria-label="More actions" class="h-9 w-9 rounded-md border border-input bg-white">⋯</button>
          ${primary}
        </div>`;
      };
      const tabs = (active, o = {}) => {
        const t = (k, n, label, status, tone = "text-muted-foreground") =>
          `<button role="tab" aria-selected="${active === k}" class="px-4 py-2 -mb-px border-b-2 ${active === k ? "border-primary text-foreground font-medium" : "border-transparent text-muted-foreground"}"><span class="font-medium">${n} ${label}</span> <span class="ml-2 text-xs ${tone}">${status}</span></button>`;
        return `<div role="tablist" class="flex border-b border-slate-300">
          ${t("groups", "①", "Groups", o.groups ?? "58 ready · 3 need attention")}
          ${t("draft", "②", "Draft", o.draft ?? "52 of 58 assigned", o.draftTone)}
        </div>`;
      };

      /* --------------------------------------------------------------- setup */
      function setup(state) {
        if (state <= 2) {
          const clash = state === 1;
          const changed = state === 2;
          const row = (d, s, e, r, i) => `
            <div class="flex items-end gap-2">
              ${sel(i === 0 ? "Day" : `<span class="sr-only">Day</span>`, d, "w-36")}
              ${sel(i === 0 ? "Start" : `<span class="sr-only">Start</span>`, s, "w-24")}
              ${sel(i === 0 ? "End" : `<span class="sr-only">End</span>`, e, "w-24")}
              ${sel(i === 0 ? "Room" : `<span class="sr-only">Room</span>`, r, "w-48")}
              <span class="h-9 flex items-center text-muted-foreground tnum">90 min</span>
              <button aria-label="Remove lesson time ${i + 1}" class="h-9 w-9 rounded-md hover:bg-muted">✕</button>
            </div>`;
          return shell(
            `<div class="text-muted-foreground">Courses & groups › A1 Evening</div>
            <h1 class="text-2xl font-semibold">A1 Evening ${badge("Group")} ${badge("A1", "info")}</h1>`,
            dialog(
              "Edit group",
              `<div class="grid grid-cols-2 gap-3">${sel("Type", "Group lesson")}${sel("Level", "A1 Beginner")}
                <div class="space-y-1"><label class="font-medium block">Name</label><input class="h-9 w-full rounded-md border border-input px-3" value="A1 Evening"/></div>
                <div class="space-y-1"><label class="font-medium block">Capacity</label><input class="h-9 w-full rounded-md border border-input px-3" value="10"/></div></div>
              <fieldset class="space-y-2 border-t border-border pt-4"><legend class="font-semibold text-base">Lesson times <span class="text-xs text-muted-foreground font-normal">(required)</span></legend>
                ${row(clash ? "Wednesday" : "Tuesday", "17:00", "18:30", "Room 3 · 8 seats", 0)}
                ${row("Thursday", "17:00", "18:30", "Room 3 · 8 seats", 1)}
                <button class="text-primary underline">+ Add lesson time</button>
                <p class="text-muted-foreground">Every week, in every term this group runs. 2 lessons · 3 h a week.</p>
              </fieldset>
              <section aria-live="polite" class="space-y-2">
                ${
                  clash
                    ? alert(
                        "danger",
                        "Conflict",
                        "Room 3 is already used by B2 Conversation on Wednesdays 17:00–18:30. Choose another room or time.",
                      ) +
                      alert(
                        "warning",
                        "Warning",
                        "2 students of this group are in A1 Kids on Wednesdays at 17:30.",
                        `<label class="flex gap-2"><input type="checkbox"/> I've checked this</label>`,
                      )
                    : `<div class="text-green-700">✓ No clashes.</div>`
                }
                ${changed ? alert("info", "These times are used the next time teachers are assigned.", "The current timetable of Autumn 2026 still has the old times.", btn("Change the current timetable too…", "outline")) : ""}
              </section>`,
              btn("Cancel", "outline") + btn("Save"),
              "max-w-3xl",
            ),
            "groups",
          );
        }
        // teacher levels
        return shell(
          `<div class="text-muted-foreground">Teachers › Tomas Horvat</div>
          <h1 class="text-2xl font-semibold">Tomas Horvat</h1>
          <div role="tablist" class="flex border-b border-slate-300"><button class="px-4 py-2 border-b-2 border-primary font-medium">Profile</button><button class="px-4 py-2 text-muted-foreground">Availability</button><button class="px-4 py-2 text-muted-foreground">Groups</button></div>
          <div class="bg-white rounded-lg border border-border p-6 space-y-4 max-w-2xl">
            <h2 class="text-lg font-semibold">Levels they teach</h2>
            <div class="grid grid-cols-3 gap-2">
              ${[
                ["A1 Beginner", 1],
                ["A2 Elementary", 1],
                ["B1 Intermediate", 1],
                ["B2 Upper-intermediate", 1],
                ["C1 Advanced", 0],
                ["C2 Proficient", 0],
              ]
                .map(
                  ([l, c]) =>
                    `<label class="flex gap-2 items-center"><input type="checkbox" ${c ? "checked" : ""}/> ${l}</label>`,
                )
                .join("")}
            </div>
            <div class="flex items-center gap-2"><span class="text-muted-foreground">Quick select:</span>${btn("Up to B2 ▾", "outline", "h-8")}${btn("All", "ghost", "h-8")}${btn("None", "ghost", "h-8")}</div>
            <p class="text-muted-foreground">The generator only gives Tomas groups of these levels. You can still pick Tomas for any group by hand.</p>
            <div class="border-t border-border pt-4 space-y-1">
              <label class="font-medium block">Max hours a week <span class="text-xs text-muted-foreground font-normal">(optional · Q3)</span></label>
              <input class="h-9 w-24 rounded-md border border-input px-3" value="20"/>
              <p class="text-xs text-muted-foreground">Leave empty for no limit. The generator never assigns more.</p>
            </div>
            <div class="flex justify-end">${btn("Save changes")}</div>
          </div>`,
          "",
          "teachers",
        );
      }

      /* --------------------------------------------------------------- groups tab */
      const GROUPS = [
        // name, level, times, room, students, canTeach, status
        ["A1 Evening", "A1", "Tue, Thu 17:00–18:30", "Room 3", 8, 5, "ready"],
        ["A2 Morning", "A2", "Mon 08:00–09:30", "Room 1", 6, 4, "ready"],
        ["B1 Evening", "B1", "Tue, Thu 17:00–18:30", "Room 2", 7, 4, "ready"],
        [
          "B1 Grammar 1-on-1",
          "B1",
          "Wed 10:00–11:00",
          "Online 1",
          1,
          4,
          "ready",
        ],
        ["C1 Business", "C1", "Wed 18:00–19:30", "Room 2", 6, 2, "ready"],
        ["C2 Proficiency", "C2", "Wed 18:00–19:30", "Online 1", 4, 0, "level"],
        ["B2 Exam prep", "B2", "—", "—", 5, 3, "times"],
        ["B1 Summer club", "B1", "Sat 10:00–12:00", "Room 2", 0, 4, "skip"],
      ];
      const statusBadge = (s, lv) =>
        ({
          ready: badge("Ready", "success"),
          level: badge(`⚠ Nobody teaches ${lv}`, "warning"),
          times: badge("⛔ No lesson times", "danger"),
          skip: badge("Skipped this term"),
        })[s];
      const readiness = (ok) =>
        ok
          ? alert("success", "Before you assign: Ready to assign teachers.")
          : `<details open class="bg-white rounded-lg border border-border p-4"><summary class="font-medium cursor-pointer">Before you assign · 4 things to check</summary>
              <ul class="mt-3 space-y-2">
                <li class="flex gap-2 items-start"><span class="text-red-700" aria-hidden="true">⛔</span><span class="flex-1">2 groups have no lesson times or room and will be skipped.</span><button class="text-primary underline">Show</button></li>
                <li class="flex gap-2 items-start"><span class="text-amber-700" aria-hidden="true">⚠</span><span class="flex-1">Nobody teaches C2. 1 group can't get a teacher.</span><button class="text-primary underline">Teachers</button></li>
                <li class="flex gap-2 items-start"><span class="text-amber-700" aria-hidden="true">⚠</span><span class="flex-1">Tue 17:00–18:30: 6 groups at A1–B1, only 4 teachers who teach them are free.</span><button class="text-primary underline">Show</button></li>
                <li class="flex gap-2 items-start"><span class="text-amber-700" aria-hidden="true">⚠</span><span class="flex-1">2 teachers have no levels yet and won't be assigned.</span><button class="text-primary underline">Teachers</button></li>
              </ul></details>`;
      const groupsTable = (o = {}) => `
        <div class="bg-white rounded-lg border border-border">
          <div class="flex items-center gap-2 p-3 border-b border-border flex-wrap">
            <input placeholder="Search groups" class="h-9 w-56 rounded-md border border-input px-3"/>
            <button class="h-9 rounded-md border border-input bg-white px-3">Level: Any ▾</button>
            <button class="h-9 rounded-md border border-input bg-white px-3">Day: Any ▾</button>
            <div role="group" aria-label="Show" class="inline-flex rounded-md border border-input overflow-hidden"><button class="px-3 h-9 bg-muted font-medium">All</button><button class="px-3 h-9 border-l border-input">Needs attention (3)</button><button class="px-3 h-9 border-l border-input">Skipped (1)</button></div>
          </div>
          <div class="relative">
          ${
            o.popover
              ? `<div class="absolute left-[640px] top-24 z-20 bg-white border border-border shadow-lg rounded-lg p-4 w-80 space-y-2" role="dialog" aria-label="Who can teach B1 Evening">
                  <div class="font-medium">4 teachers teach B1</div>
                  <table class="w-full text-xs"><thead class="text-muted-foreground"><tr><th class="text-left">Teacher</th><th>Tue</th><th>Thu</th></tr></thead><tbody>
                  ${[
                    ["Ana Kral", "✓", "✓"],
                    ["Tomas Horvat", "✓", "✓"],
                    ["Eva Simon", "✓", "✗ unavailable"],
                    ["Peter Varga", "✓", "✓"],
                  ]
                    .map(
                      ([n, a, b]) =>
                        `<tr class="border-t border-border"><td class="py-1">${n}</td><td class="text-center">${a}</td><td class="text-center">${b}</td></tr>`,
                    )
                    .join("")}
                  </tbody></table>
                  <p class="text-xs text-muted-foreground">Who's actually free also depends on the other groups at that time; the generator works that out.</p>
                </div>`
              : ""
          }
          <table class="w-full text-left">
            <thead class="bg-muted text-xs text-muted-foreground"><tr>
              <th class="px-3 py-2">Group ↑</th><th class="px-3 py-2">Level</th><th class="px-3 py-2">Lesson times</th><th class="px-3 py-2">Room</th><th class="px-3 py-2">Students</th><th class="px-3 py-2">Can teach</th><th class="px-3 py-2">Status</th><th class="px-3 py-2"><span class="sr-only">Actions</span></th>
            </tr></thead>
            <tbody>${GROUPS.map(
              ([n, lv, t, r, st, ct, s]) =>
                `<tr class="border-t border-border ${s === "skip" ? "text-muted-foreground" : s === "ready" ? "bg-white" : s === "times" ? "bg-red-50" : "bg-amber-50"}">
                  <td class="px-3 py-2 font-medium">${s === "skip" ? "○ " : ""}<a href="#" class="underline decoration-slate-300">${n}</a></td>
                  <td class="px-3 py-2">${lv}</td><td class="px-3 py-2 tnum">${t}</td><td class="px-3 py-2">${r}</td><td class="px-3 py-2 tnum">${st}</td>
                  <td class="px-3 py-2"><button class="underline decoration-dotted">${ct === 0 ? "Nobody" : ct + " teachers"}</button></td>
                  <td class="px-3 py-2">${statusBadge(s, lv)}</td>
                  <td class="px-3 py-2">${s === "skip" ? `<button class="text-primary underline">Include</button>` : `<button aria-label="Actions, ${n}" class="w-8 h-8 rounded-md hover:bg-muted">⋯</button>`}</td>
                </tr>`,
            ).join("")}</tbody>
          </table></div>
          <div class="border-t border-border px-3 py-2 text-muted-foreground bg-muted tnum">58 groups · 104 lessons a week · 151 teaching hours · 20 teachers can give 168 h</div>
        </div>`;
      function groups(state) {
        if (state === 2)
          return shell(`${header({ noPrimary: true })}
            <div class="bg-white rounded-lg border border-border p-12 text-center space-y-3 max-w-xl mx-auto mt-8">
              <div class="text-4xl" aria-hidden="true">👥</div>
              <h2 class="text-lg font-semibold">No groups yet</h2>
              <p class="text-muted-foreground">Create groups with their lesson times first.</p>
              ${btn("Go to Courses & groups")}
            </div>`);
        if (state === 3)
          return shell(
            `${header()}${tabs("groups", { groups: "58 ready · all set" })}${readiness(true)}${groupsTable()}`,
          );
        return shell(
          `${header()}${tabs("groups")}${readiness(false)}${groupsTable({ popover: state === 1 })}`,
        );
      }

      /* --------------------------------------------------------------- assign dialog */
      function assign(state) {
        const base = `${header()}${tabs("groups")}${readiness(false)}${groupsTable()}`;
        if (state === 0)
          return shell(
            base,
            dialog(
              "Assign teachers for Spring 2027",
              `<p><strong>58 groups, 20 teachers.</strong></p>
              ${alert("warning", "2 groups aren't ready and are skipped.", "", `<button class="underline">Review</button>`)}
              <fieldset class="space-y-2 border border-border rounded-md p-3"><legend class="px-1 font-medium">This term already has teachers on 12 slots.</legend>
                <label class="flex gap-2"><input type="radio" name="e" checked/> Keep current teachers <span class="text-muted-foreground">(locked)</span></label>
                <label class="flex gap-2"><input type="radio" name="e"/> Reassign everything</label>
              </fieldset>
              <p class="text-muted-foreground">When several teachers fit, workloads are kept as even as possible.</p>`,
              btn("Cancel", "outline") + btn("Assign teachers"),
            ),
          );
        if (state === 1)
          return shell(
            `${header({ published: true, term: "Autumn 2026" })}${tabs("groups")}${groupsTable()}`,
            dialog(
              "Assign teachers for Autumn 2026",
              `<p><strong>61 groups, 20 teachers.</strong></p>
              <div class="space-y-1"><label class="font-medium block">From</label><button class="h-9 w-48 rounded-md border border-input bg-white px-3 text-left">Mon 3 Nov 2026 📅</button><p class="text-xs text-muted-foreground">Lessons before this date are not touched.</p></div>
              <fieldset class="space-y-2"><legend class="sr-only">Which groups</legend>
                <label class="flex gap-2"><input type="radio" name="m" checked/> Only groups without a teacher <span class="text-muted-foreground">(3 new groups)</span></label>
                <label class="flex gap-2"><input type="radio" name="m"/> Reconsider every group</label>
              </fieldset>
              <p class="text-muted-foreground">When several teachers fit, workloads are kept as even as possible.</p>`,
              btn("Cancel", "outline") + btn("Assign teachers"),
            ),
          );
        if (state === 2)
          return shell(
            base,
            dialog(
              "Assign teachers for Spring 2027",
              `<p><strong>58 groups, 20 teachers.</strong></p>
              <div class="space-y-2"><div class="flex items-center gap-2"><span class="animate-spin" aria-hidden="true">◌</span> Assigning teachers… 31 of 58 groups</div>

            <div class="space-y-3"><div class="skeleton h-24 w-full"></div>${Array.from({ length: 8 }, () => `<div class="skeleton h-8 w-full"></div>`).join("")}</div>`);
        if (state === 3)
          return shell(`${header({ noPrimary: true })}${tabs("groups")}
            ${alert("danger", "Something went wrong", "We couldn't load this page.", btn("Try again", "outline"))}`);
      }

      /* --------------------------------------------------------------- router */
      const SCREENS = [
        {
          k: "setup",
          label: "Setup: group & teacher",
          states: [
            "group · lesson times",
            "group · clash",
            "group · changed (published term)",
            "teacher · levels they teach",
          ],
          fn: setup,
        },
        {
          k: "groups",
          label: "① Groups",
          states: [
            "readiness + table",
            "who can teach",
            "no groups",
            "all ready",
          ],
          fn: groups,
        },
        {
          k: "assign",
          label: "Assign dialog",
          states: [
            "draft term",
            "published term · from date",
            "running",
            "nothing ready",
            "failed",
          ],
          fn: assign,
        },
        {
          k: "draft",
          label: "② Draft",
          states: [
            "by group",
            "teacher picker",
            "why no teacher",
            "by teacher (workload)",
            "week (one teacher)",
            "compare to current",
            "changed by hand (toast)",
            "out of date",
            "no draft yet",
          ],
          fn: draft,
        },
        {
          k: "publish",
          label: "Publish",
          states: [
            "draft term",
            "published term · from date",
            "blocked · live changed",
            "done → editor",
          ],
          fn: publish,
        },
        {
          k: "other",
          label: "Other states",
          states: ["403 teacher/student", "< 1024 px", "loading", "load error"],
          fn: other,
        },
      ];
      let cur = { screen: "groups", state: 0 };
      function render() {
        const s = SCREENS.find((x) => x.k === cur.screen);
        document.getElementById("wf-screens").innerHTML = SCREENS.map(
          (x) =>
            `<button data-go="${x.k}" class="px-2 py-1 rounded ${x.k === cur.screen ? "bg-white text-slate-900 font-medium" : "bg-slate-700 hover:bg-slate-600"}">${x.label}</button>`,
        ).join("");
        document.getElementById("wf-states").innerHTML = s.states
          .map(
            (st, i) =>
              `<button data-state="${i}" class="px-2 py-1 rounded ${i === cur.state ? "bg-blue-500 text-white" : "bg-slate-700 hover:bg-slate-600"}">${st}</button>`,
          )
          .join("");
        document.getElementById("stage").innerHTML = s.fn(cur.state);
      }
      document.addEventListener("click", (e) => {
        const go = e.target.closest("[data-go]"),
          st = e.target.closest("[data-state]");
        if (go) {
          e.preventDefault();
          cur = { screen: go.dataset.go, state: 0 };
        } else if (st) cur.state = +st.dataset.state;
        else return;
        render();
      });
      render();
    </script>
  </body>
</html>
