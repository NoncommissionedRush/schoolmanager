<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Wireframe — Lessons: lesson log, homework & internal notes (CARM-34)
    </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            colors: {
              background: "#ffffff",
              foreground: "#0f172a",
              muted: { DEFAULT: "#f1f5f9", foreground: "#475569" },
              primary: { DEFAULT: "#2563eb", foreground: "#ffffff" },
              accent: { DEFAULT: "#eff6ff", foreground: "#1e40af" },
              destructive: { DEFAULT: "#dc2626", foreground: "#ffffff" },
              border: "#e2e8f0",
              input: "#64748b",
              ring: "#2563eb",
            },
            borderRadius: { lg: "0.5rem", md: "6px", sm: "4px" },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      .tnum {
        font-variant-numeric: tabular-nums;
      }
      .skeleton {
        background: #e2e8f0;
        border-radius: 4px;
      }
      .internal {
        background: #f8fafc;
        border: 1px dashed #475569;
      }
      .internal-band {
        background: #1e293b;
        color: #fff;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body class="bg-slate-200 font-sans text-sm text-foreground">
    <div
      class="sticky top-0 z-50 flex flex-wrap items-center gap-x-4 gap-y-2 bg-slate-900 px-4 py-2 text-xs text-slate-100"
    >
      <strong class="text-sm">Wireframe · Lessons</strong>
      <div class="flex flex-wrap gap-1" id="wf-screens"></div>
      <div class="flex items-center gap-1">
        <span class="text-slate-400">State:</span>
        <div class="flex flex-wrap gap-1" id="wf-states"></div>
      </div>
    </div>
    <div id="stage" class="flex justify-center p-6"></div>

    <script>
      /* --------------------------------------------------------------- helpers */
      const btn = (label, v = "primary", extra = "") => {
        const c = {
          primary: "bg-primary text-white hover:bg-blue-700",
          outline: "border border-input bg-white hover:bg-muted",
          ghost: "hover:bg-muted",
          destructive: "bg-destructive text-white",
          disabled: "bg-slate-200 text-slate-500 cursor-not-allowed",
        }[v];
        return `<button class="h-9 px-3 rounded-md font-medium inline-flex items-center gap-2 ${c} ${extra}">${label}</button>`;
      };
      const badge = (t, tone = "muted") => {
        const c = {
          muted: "bg-slate-100 text-slate-700 border-slate-300",
          success: "bg-green-50 text-green-700 border-green-300",
          warning: "bg-amber-50 text-amber-700 border-amber-300",
          danger: "bg-red-50 text-red-700 border-red-300",
          info: "bg-blue-50 text-blue-700 border-blue-300",
          dark: "bg-slate-800 text-white border-slate-800",
        }[tone];
        return `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 text-xs font-medium rounded-sm border ${c}">${t}</span>`;
      };
      const alert = (t, tone = "info") => {
        const c = {
          info: "bg-blue-50 text-blue-800 border-blue-300",
          warning: "bg-amber-50 text-amber-800 border-amber-300",
          danger: "bg-red-50 text-red-800 border-red-300",
        }[tone];
        return `<div role="${tone === "danger" ? "alert" : "status"}" class="rounded-md border px-3 py-2 ${c}">${t}</div>`;
      };
      const card = (inner, extra = "") =>
        `<section class="rounded-lg border border-border bg-white p-6 ${extra}">${inner}</section>`;
      const COVERED =
        "Unit 4: present perfect vs past simple.\nSpeaking practice in pairs, vocabulary p. 52.";
      const HW = "One page essay about your favourite movie.";

      function header({ status, sub, admin, mobile }) {
        const st = {
          none: "",
          noLog: badge("📝 No log yet", "warning"),
          cancelled: badge("⊘ Cancelled", "danger"),
        }[status];
        return `<div class="space-y-2">
          <div class="flex items-center justify-between"><a href="#" class="text-primary">‹ ${admin ? "Timetable" : "My timetable"}</a>
            <div class="flex gap-1">${btn("‹", "ghost", "w-9 justify-center")}${btn("›", "ghost", "w-9 justify-center")}</div></div>
          <div class="flex flex-wrap items-center gap-3"><h1 class="text-2xl font-semibold">B1 Evening</h1>${st}
            ${admin ? `<div class="ml-auto flex gap-2">${btn("Open in timetable", "outline")}${btn("Open slot in editor", "outline")}</div>` : ""}</div>
          <p class="text-muted-foreground tnum ${mobile ? "text-base" : ""}">Mon 20 Oct 2026 · 17:00–18:30 · Room 3 · 👥 Group lesson · B1</p>
          ${sub ? alert("👤 You're substituting for Tomas Horvat in this lesson.") : ""}
          ${status === "cancelled" ? alert("This lesson was cancelled: Holiday", "danger") : ""}
          ${admin ? alert("Admins can view this lesson. Teachers write the lesson log and homework.") : ""}
        </div>`;
      }

      function logCard(st) {
        // empty | dirty | saved | future | cancelled | error | conflict | loading | admin
        if (st === "loading")
          return card(
            `<div class="skeleton h-6 w-40 mb-4"></div><div class="skeleton h-24 mb-3"></div><div class="skeleton h-14"></div>`,
          );
        const head = `<div class="flex flex-wrap items-center gap-3 mb-3"><h2 class="text-lg font-semibold">Lesson log</h2><span class="text-muted-foreground">👁 Students in this group can see this.</span></div>`;
        if (st === "cancelled")
          return card(
            head +
              `<p class="text-muted-foreground">No lesson log for cancelled lessons.</p>`,
          );
        if (st === "future")
          return card(
            head +
              `<p class="text-muted-foreground">You can fill this in once the lesson has started.</p>`,
          );
        if (st === "admin")
          return card(
            head +
              `<h3 class="font-semibold">What we covered</h3><p class="whitespace-pre-wrap mb-3">${COVERED}</p><h3 class="font-semibold">Homework</h3><p class="mb-3">${HW}</p><p class="text-xs text-muted-foreground">Last saved by Tomas Horvat, 20 Oct 18:40</p>`,
          );
        const filled = st !== "empty";
        return card(
          head +
            (st === "conflict"
              ? `<div class="mb-3">${alert("Ana Kral saved this lesson log while you were editing. Copy your text, reload, and save again.", "warning")}</div>`
              : "") +
            `<div class="space-y-4">
               <div class="space-y-2"><label class="block font-medium" for="cov">What we covered</label>
               <textarea id="cov" rows="4" class="w-full rounded-md border border-input p-3" placeholder="e.g. Unit 4: present perfect vs past simple, speaking practice in pairs.">${filled ? COVERED : ""}</textarea></div>
               <div class="space-y-2"><label class="block font-medium" for="hw">Homework (optional)</label>
               <textarea id="hw" rows="2" aria-describedby="hwh" class="w-full rounded-md border border-input p-3" placeholder="e.g. One page essay about your favourite movie.">${filled ? HW : ""}</textarea>
               <p id="hwh" class="text-xs text-muted-foreground">What students should prepare for the next lesson.</p></div>
             </div>` +
            (st === "error"
              ? `<div class="mt-3">${alert("The lesson log couldn't be saved. Check your connection and try again. Your text is kept.", "danger")}</div>`
              : "") +
            `<div class="flex items-center gap-3 mt-4"><span class="text-xs text-muted-foreground">${st === "saved" ? "Last saved by Tomas Horvat, 20 Oct 18:40" : st === "empty" ? "Not saved yet" : "Unsaved changes"}</span><div class="ml-auto">${btn("Save", st === "saved" ? "outline" : "primary")}</div></div>`,
        );
      }

      function prevHomework(st) {
        if (st === "loading" || st === "admin") return "";
        return `<section class="rounded-lg border border-border bg-white p-4"><h2 class="font-semibold">Homework from the previous lesson (Wed 15 Oct)</h2><p class="text-muted-foreground">Workbook p. 34, exercises 1–3.</p></section>`;
      }

      function notesCard(st) {
        if (st === "loading")
          return `<section class="internal rounded-lg"><div class="skeleton h-40 m-4"></div></section>`;
        const admin = st === "admin";
        const notes =
          st === "empty" || st === "future"
            ? `<p class="text-muted-foreground">No internal notes yet. Use them for things only teachers and admins should know, like learning needs.</p>`
            : `<h3 class="font-semibold">Notes on this lesson</h3>
            <article class="border-t border-slate-300 py-3 space-y-1"><div class="flex items-center gap-2 text-xs text-muted-foreground"><span class="font-medium text-foreground">Tomas Horvat</span>· <time title="20 Oct 2026 18:42">today</time> ${badge("Jan Kos")}<button class="ml-auto h-6 w-6 rounded hover:bg-muted" aria-label="Note actions">⋯</button></div><p>Struggles with written tasks; give him extra time.</p></article>
            <article class="border-t border-slate-300 py-3 space-y-1"><div class="flex items-center gap-2 text-xs text-muted-foreground"><span class="font-medium text-foreground">Ana Kral</span>· <time>today</time> ${badge("Lesson")} · Edited</div><p>Projector in Room 3 flickers — reported.</p></article>
            <button class="w-full text-left py-2 font-medium text-primary" aria-expanded="false">▸ 4 earlier notes about this group and its students</button>`;
        return `<section aria-labelledby="notes-h" class="internal rounded-lg overflow-hidden lg:sticky lg:top-20">
          <div class="internal-band flex items-center gap-2 px-4 py-2 font-medium"><span aria-hidden="true">🔒</span> Internal — only teachers and admins see this</div>
          <div class="p-4 space-y-3">
            <h2 id="notes-h" class="text-lg font-semibold">Internal notes</h2>
            ${
              admin
                ? ""
                : `<div class="space-y-2"><label class="block font-medium">About</label><button class="h-9 w-full rounded-md border border-input bg-white px-3 text-left">This lesson ▾</button>
              <label class="block font-medium" for="nt">Internal note (students can't see this)</label><textarea id="nt" rows="3" class="w-full rounded-md border border-input bg-white p-2"></textarea>
              <div class="flex justify-end">${btn("Add note", "outline")}</div></div>`
            }
            ${notes}
          </div></section>`;
      }

      /* ------------------------------------------------------------- screens */
      const T_STATES = [
        "empty (no log yet)",
        "unsaved changes",
        "saved",
        "substitute",
        "future lesson",
        "cancelled",
        "save error",
        "conflict",
        "loading",
        "unsaved dialog",
      ];
      function teacherLesson(i) {
        const st = [
          "empty",
          "dirty",
          "saved",
          "saved",
          "future",
          "cancelled",
          "error",
          "conflict",
          "loading",
          "dirty",
        ][i];
        const status =
          st === "empty" ? "noLog" : st === "cancelled" ? "cancelled" : "none";
        const dialog =
          i === 9
            ? `<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-40"><div role="alertdialog" aria-labelledby="ud" class="bg-white rounded-lg shadow-lg p-6 max-w-md space-y-3"><h2 id="ud" class="text-lg font-semibold">Discard unsaved changes?</h2><p class="text-muted-foreground">Your changes to the lesson log haven't been saved.</p><div class="flex justify-end gap-2">${btn("Keep editing", "outline")}${btn("Discard", "destructive")}</div></div></div>`
            : "";
        return `<div class="w-[1180px] bg-muted rounded-lg border border-slate-300 p-6 space-y-6">
          ${header({ status, sub: i === 3 })}
          <div class="grid grid-cols-12 gap-6 items-start">
            <div class="col-span-8 space-y-6">${logCard(st)}${prevHomework(st)}</div>
            <div class="col-span-4">${notesCard(st === "empty" || st === "future" || st === "loading" ? st : "with")}</div>
          </div>${dialog}</div>`;
      }
      function teacherMobile(i) {
        const st = ["dirty", "saved"][i];
        return `<div class="w-[390px] bg-muted rounded-[24px] border-4 border-slate-800 overflow-hidden">
          <div class="h-14 bg-white border-b border-border flex items-center px-4 gap-3"><span>☰</span><span class="font-medium">Lingua Language School</span><span class="ml-auto w-8 h-8 rounded-full bg-slate-300"></span></div>
          <div class="p-4 space-y-4">${header({ status: "none", mobile: true })}${logCard(st).replace(/p-6/, "p-4")}${prevHomework(st)}${notesCard("with")}</div></div>`;
      }
      function lessonList(i) {
        const filters = ["No log yet (2)", "Upcoming", "Past"];
        const sel = Math.min(i, 2);
        const data =
          sel === 2
            ? [
                [
                  "Wed 15 Oct · 17:00",
                  "👥 B1 Evening",
                  "Reading: 'A day in London'…",
                  "Workbook p. 34, ex. 1–3",
                ],
                [
                  "Mon 13 Oct · 17:00",
                  "👥 B1 Evening",
                  "Revision unit 3…",
                  "—",
                ],
              ]
            : sel === 1
              ? [["Wed 22 Oct · 17:00", "👥 B1 Evening", "—", "—"]]
              : [
                  ["Mon 20 Oct · 17:00", "👥 B1 Evening", "—", "—"],
                  ["Mon 20 Oct · 10:00", "👤 Eva Novak 1-on-1", "—", "—"],
                ];
        const head = [
          "Date & time",
          "Group",
          ...(i === 4 ? ["Teacher"] : []),
          "What we covered",
          "Homework",
        ];
        const rows =
          i === 3
            ? `<tr><td colspan="4" class="py-12 text-center"><p class="text-lg font-semibold">You're all caught up.</p></td></tr>`
            : data
                .map((r) => {
                  const cells =
                    i === 4 ? [r[0], r[1], "Tomas Horvat", r[2], r[3]] : r;
                  return `<tr class="border-t border-border hover:bg-accent">${cells.map((c, j) => `<td class="px-3 py-2 ${j === 0 ? "tnum" : ""}">${j === 0 ? `<a href="#" class="text-primary">${c}</a>` : c}</td>`).join("")}</tr>`;
                })
                .join("");
        return `<div class="w-[1100px] bg-muted rounded-lg border border-slate-300 p-6 space-y-4">
          <h1 class="text-2xl font-semibold">Lesson log</h1>
          <div class="flex flex-wrap gap-3 items-center"><div role="tablist" class="inline-flex rounded-md bg-white border border-border p-1">${filters.map((f, j) => `<button role="tab" aria-selected="${j === sel}" class="px-3 h-8 rounded ${j === sel ? "bg-primary text-white" : ""}">${i === 3 && j === 0 ? "No log yet (0)" : f}</button>`).join("")}</div>
          <button class="h-9 rounded-md border border-input bg-white px-3">Group: All ▾</button>${i === 4 ? `<button class="h-9 rounded-md border border-input bg-white px-3">Teacher: All ▾</button><span class="text-muted-foreground">(admin /admin/lessons)</span>` : ""}</div>
          ${card(`<table class="w-full text-left"><thead class="bg-muted"><tr>${head.map((h) => `<th class="px-3 py-2">${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>`, "p-0 overflow-hidden")}
        </div>`;
      }
      function phone(inner, tab = 2) {
        return `<div class="w-[390px] min-h-[760px] bg-white rounded-[24px] border-4 border-slate-800 overflow-hidden flex flex-col text-base">
          <div class="h-14 border-b border-border flex items-center px-4 gap-3"><span>☰</span><span class="font-medium">Lingua Language School</span><span class="ml-auto w-8 h-8 rounded-full bg-slate-300"></span></div>
          <main class="flex-1 p-4 space-y-4">${inner}</main>
          <nav aria-label="Primary" class="h-16 border-t border-border grid grid-cols-4 text-xs shrink-0">${["Home", "Timetable", "Homework", "More"].map((t, i) => `<a href="#" class="flex flex-col items-center justify-center ${i === tab ? "text-primary font-medium" : "text-muted-foreground"}" ${i === tab ? 'aria-current="page"' : ""}><span class="text-lg">${["⌂", "▦", "☰", "≡"][i]}</span>${t}</a>`).join("")}</nav></div>`;
      }
      function studentHomework(i) {
        if (i === 1)
          return phone(
            `<h1 class="text-2xl font-semibold">Homework</h1><div class="text-center py-12 space-y-2"><div class="text-4xl text-muted-foreground">📋</div><h2 class="text-lg font-semibold">No lessons yet</h2><p class="text-muted-foreground">After your first lesson, you'll see what was covered and the homework here.</p></div>`,
          );
        if (i === 2)
          return phone(
            `<div class="skeleton h-8 w-48"></div>${Array(4).fill('<div class="skeleton h-28"></div>').join("")}`,
          );
        if (i === 3)
          return phone(
            `<h1 class="text-2xl font-semibold">Homework</h1>${alert("<strong>Something went wrong.</strong> We couldn't load your lessons. " + btn("Try again", "outline", "mt-2"), "danger")}`,
          );
        if (i === 4)
          return phone(
            `<h1 class="text-2xl font-semibold">Hi, Jan</h1><div class="rounded-lg border border-border p-4 space-y-3"><div class="flex justify-between"><h2 class="text-lg font-semibold">Latest homework</h2><a class="text-primary" href="#">See all</a></div>
            <div class="border-t pt-2"><p class="text-sm text-muted-foreground tnum">B1 Evening · Mon 20 Oct</p><p class="font-medium">${HW}</p></div>
            <div class="border-t pt-2"><p class="text-sm text-muted-foreground tnum">Eva Novak 1-on-1 · Fri 17 Oct</p><p class="font-medium">Read chapter 2 of the graded reader.</p></div></div>`,
            0,
          );
        const items = [
          [
            "Mon 20 Oct",
            "B1 Evening",
            HW,
            "Unit 4: present perfect vs past simple. Speaking practice in pairs, vocabulary p. 52.",
          ],
          [
            "Wed 15 Oct",
            "B1 Evening",
            "",
            "Reading: 'A day in London', new vocabulary.",
          ],
          ["Mon 13 Oct", "B1 Evening", "C", ""],
          ["Wed 8 Oct", "B1 Evening", "-", "-"],
        ];
        const cards = items
          .map(([d, g, hw, cov]) =>
            hw === "C"
              ? `<div class="rounded-lg border border-dashed border-slate-400 bg-slate-50 p-4 text-slate-600"><div class="flex justify-between"><span class="line-through tnum">${d} · ${g}</span>${badge("Cancelled", "danger")}</div></div>`
              : hw === "-"
                ? `<a href="#" class="block rounded-lg border border-border p-4 space-y-1 min-h-[44px]"><p class="text-sm text-muted-foreground tnum">${d} · ${g}</p><p class="text-muted-foreground">Your teacher hasn't added notes for this lesson yet.</p></a>`
                : `<a href="#" class="block rounded-lg border border-border p-4 space-y-2 hover:bg-accent min-h-[44px]"><p class="text-sm text-muted-foreground tnum">${d} · ${g}</p>${hw ? `<p class="font-medium">📋 ${hw}</p>` : `<p class="text-muted-foreground">No homework</p>`}<p class="text-sm text-muted-foreground line-clamp-2">We covered: ${cov}</p></a>`,
          )
          .join("");
        return phone(`<h1 class="text-2xl font-semibold">Homework</h1><button class="h-11 w-full rounded-md border border-input px-3 text-left">All groups ▾</button>
          <h2 class="text-lg font-semibold">October</h2>${cards}${btn("Load more", "outline", "w-full justify-center h-11")}`);
      }
      function studentLesson(i) {
        const empty = i === 1;
        return phone(
          `<a href="#" class="text-primary">‹ Homework</a>
          <h1 class="text-2xl font-semibold">B1 Evening</h1>
          <p class="text-muted-foreground tnum">Mon 20 Oct 2026 · 17:00–18:30<br/>Tomas Horvat · Room 3</p>
          <section class="space-y-2"><h2 class="text-lg font-semibold">Homework</h2>${empty ? `<p class="text-muted-foreground">No homework for this lesson.</p>` : `<p class="font-medium">${HW}</p>`}</section>
          <section class="space-y-2"><h2 class="text-lg font-semibold">What we covered</h2>${empty ? `<p class="text-muted-foreground">Your teacher hasn't written the lesson log yet.</p>` : `<p class="whitespace-pre-wrap">${COVERED}</p>`}</section>
          <p class="text-xs text-muted-foreground border-t pt-3">Never shown here: internal notes, other students' names.</p>`,
        );
      }
      function adminLesson() {
        return `<div class="w-[1180px] bg-muted rounded-lg border border-slate-300 p-6 space-y-6">
          ${header({ status: "none", admin: true })}
          <div class="grid grid-cols-12 gap-6 items-start"><div class="col-span-8 space-y-6">${logCard("admin")}</div><div class="col-span-4">${notesCard("admin")}</div></div></div>`;
      }

      /* ---------------------------------------------------------------- render */
      const SCREENS = [
        {
          k: "teacher",
          label: "Teacher lesson (desktop)",
          states: T_STATES,
          fn: teacherLesson,
        },
        {
          k: "teacherM",
          label: "Teacher lesson (mobile)",
          states: ["unsaved", "saved"],
          fn: teacherMobile,
        },
        {
          k: "list",
          label: "Lesson log list",
          states: [
            "no log yet",
            "upcoming",
            "past",
            "all caught up",
            "admin variant",
          ],
          fn: lessonList,
        },
        {
          k: "homework",
          label: "Student homework tab",
          states: ["list", "empty", "loading", "error", "home card"],
          fn: studentHomework,
        },
        {
          k: "slesson",
          label: "Student lesson",
          states: ["filled", "nothing written yet"],
          fn: studentLesson,
        },
        {
          k: "admin",
          label: "Admin lesson",
          states: ["read-only"],
          fn: adminLesson,
        },
      ];
      let cur = { screen: "teacher", state: 0 };
      function render() {
        const s = SCREENS.find((x) => x.k === cur.screen);
        document.getElementById("wf-screens").innerHTML = SCREENS.map(
          (x) =>
            `<button data-go="${x.k}" class="px-2 py-1 rounded ${x.k === cur.screen ? "bg-white text-slate-900 font-medium" : "bg-slate-700 hover:bg-slate-600"}">${x.label}</button>`,
        ).join("");
        document.getElementById("wf-states").innerHTML = s.states
          .map(
            (st, i) =>
              `<button data-state="${i}" class="px-2 py-1 rounded ${i === cur.state ? "bg-blue-500 text-white" : "bg-slate-700 hover:bg-slate-600"}">${st}</button>`,
          )
          .join("");
        document.getElementById("stage").innerHTML = s.fn(cur.state);
      }
      document.addEventListener("click", (e) => {
        const go = e.target.closest("[data-go]"),
          st = e.target.closest("[data-state]");
        if (go) {
          e.preventDefault();
          cur = { screen: go.dataset.go, state: 0 };
        } else if (st) cur.state = +st.dataset.state;
        else return;
        render();
      });
      render();
    </script>
  </body>
</html>
